# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Install: brew install go-task
# Usage:   task --list
#
#   task dev          everything, plus the frontend        ← start here
#   task quickstart   the same stack, no frontend
#   task up           no fake product data
#   task up:bare      no organization, no user either
#
# Three entry points because "empty" is a real thing to want and used to be
# unreachable: every path ran the account seeder, so the emptiest stack
# available still had four organizations and five users in it, and JIT
# provisioning -- what actually happens on a real first login -- could not be
# exercised locally at all. The three differ only in which compose profiles
# they enable.
#
# Sequencing lives in compose.yml, not here. Everything else -- migrations
# before seeding, accounts before the API, the API answering before the bulk
# seed -- is a depends_on edge there, where it can be read as a graph instead
# of reverse-engineered from the order of lines in a shell script.

# Existing local config wins; tracked local defaults also make the first setup
# usable before .env exists. Compose reads only this exported effective config.
dotenv: [".env", ".env.example"]

env:
  # The uid every container that touches ./dev runs as. ./dev is a bind mount
  # holding credentials that are written atomically (temp file beside the target,
  # then rename), so the container needs write permission on the DIRECTORY -- and
  # a bind-mounted directory keeps its host ownership on Linux, where that is
  # enforced. The images declare uid 65532, ./dev belongs to whoever ran `task`,
  # and those two being different is why every credential write failed with
  # EACCES on a Linux runner while passing on macOS, whose Docker maps
  # bind-mount ownership to the mounting user. Matching them is the fix; the
  # alternative was making ./dev world-writable.
  KAITEN_DEV_UID:
    sh: id -u
  KAITEN_DEV_GID:
    sh: id -g
  # compose's project name isolates containers, networks and volumes. It does
  # NOT reach `container_name:`, which is a literal -- so two projects would
  # still fight over the name `kaiten-api`, and the second one to start would
  # fail. Deriving the prefix from PROJECT is what keeps them apart, and why
  # this is here rather than in .env: the two must never disagree.
  KAITEN_CONTAINER_PREFIX: "{{.PROJECT}}"
  # The host side of the /credentials bind mount, absolute so that neither
  # compose's project-directory resolution nor the mkdir below can disagree
  # about which directory this is. compose.yml falls back to ./dev for anyone
  # driving it without task.
  #
  # Wrapped in `default` (not a bare template) so a caller can override it --
  # this is a plain env var, and without `default` it would recompute from
  # this Taskfile's own TASKFILE_DIR on every invocation and clobber any
  # value already set in the environment or passed on the CLI, CLI-style
  # overrides included. A second stack relies on the override: it runs
  # `task app` with its OWN dev dir so the frontend reads that stack's
  # tokens.json instead of this checkout's.
  KAITEN_DEV_DIR: '{{default (printf "%s/dev" .TASKFILE_DIR) .KAITEN_DEV_DIR}}'

vars:
  # The compose project name, and with it the isolation boundary: its own
  # containers, network and volumes. Named rather than left to compose's
  # directory-name default, because the name is the thing being chosen: a
  # second stack can layer this very compose file under a project of its own,
  # and the two run side by side.
  #
  # `task up PROJECT=kaiten-wip` gives a third. What that does not give is
  # different HOST PORTS: published ports are the one thing a project name does
  # not isolate, so a second stack needs the port block .env.example describes.
  PROJECT: '{{default "kaiten-oss" .PROJECT}}'
  COMPOSE: >-
    docker compose --progress quiet
    --project-name "{{.PROJECT}}"
    --env-file /dev/null
    -f "{{.TASKFILE_DIR}}/compose.yml"
  # Tool versions live here; explicit setup:tools provisions api/bin once.
  # Ordinary lint never downloads tools or switches the installed toolchain.
  # GOLANGCI_LINT_VERSION must match .github/workflows/go-ci.yml and
  # .pre-commit-config.yaml.
  GOLANGCI_LINT_VERSION: v2.13.1
  DEADCODE_VERSION: v0.49.0
  # Pinned like every other tool here. The vulnerability database is fetched
  # at run time regardless, so pinning the scanner costs no freshness.
  GOVULNCHECK_VERSION: v1.7.0
  # `go ... ./...` does not descend into a nested module, so every quality
  # target has to name both of them.
  MODULES: ". cmd/schema-docs"
  READY_SERVICES: '{{default "api envoy db rabbitmq api-dapr-sidecar debezium local-jwks jaeger" .READY_SERVICES}}'
  ONESHOT_SERVICES: '{{default "migrate bootstrap api-ready" .ONESHOT_SERVICES}}'
  READY_URLS: '{{default (printf "http://localhost:%s/api/healthz" (default "6060" .KAITEN_PORT)) .READY_URLS}}'
  NVM: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # ─────────────────────────────────────────────────────────────────────────────
  # Start here
  # ─────────────────────────────────────────────────────────────────────────────

  setup:
    desc: "Explicit dependencies, generated client and local images; no application start"
    cmds:
      - task: setup:check
      - test -e .env || test -L .env || sh -c 'umask 077; cp .env.example .env'
      # Re-enter Task so dotenv includes the configuration just created above.
      - task --taskfile "{{.TASKFILE_DIR}}/Taskfile.yml" setup:prepared

  setup:prepared:
    desc: "Provision after local configuration is loaded (used by setup)"
    cmds:
      - for: { var: MODULES }
        cmd: cd "{{.TASKFILE_DIR}}/api/{{.ITEM}}" && go mod download
      - task: setup:tools
      - task: setup:app
      - task: setup:browser
      - task: setup:images

  setup:check:
    desc: "Check tools before explicit provisioning (no install)"
    preconditions:
      - sh: node -e 'if (+process.versions.node.split(".")[0] !== 24) process.exit(1)'
        msg: "Use Node 24 from app/.nvmrc"
      - sh: test "$(COREPACK_ENABLE_NETWORK=0 pnpm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"
        msg: "Explicitly activate the pnpm version pinned in package.json with Corepack"
      - sh: go version | grep -Eq 'go1\.27\.'
        msg: "Use Go 1.27.x from api/go.mod"
      - sh: docker compose version --short | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const [a,b,c]=s.trim().replace(/^v/,"").split(".").map(Number);if(!(a>2||(a===2&&(b>24||(b===24&&c>=4)))))process.exit(1)})'
        msg: "Docker Compose >=2.24.4 is required for optional profile dependencies"
    cmds:
      - echo "Required tools available; setup explicitly provisions dependencies next"

  setup:tools:
    desc: "Explicitly provision pinned Go quality tools into api/bin"
    env: { GOBIN: "{{.TASKFILE_DIR}}/api/bin" }
    cmds:
      # Existing CI needs Go 1.27.1 specifically for this linter's export-data reader.
      # This explicit provisioning task may acquire that toolchain; lint itself never does.
      - GOTOOLCHAIN=go1.27.1 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install golang.org/x/tools/cmd/deadcode@{{.DEADCODE_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}

  setup:app:
    desc: "Explicit frozen workspace install and frontend generation only; no runtime"
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm --dir app run generate

  setup:wasm:
    desc: "Explicitly provision/build the existing CEL WASM artifact"
    dir: app
    preconditions:
      - sh: command -v cargo && command -v wasm-pack
        msg: "Install Rust/cargo and wasm-pack explicitly for the optional CEL engine"
    cmds:
      - cargo fetch --locked --manifest-path cel-engine/Cargo.toml
      - pnpm run build:wasm -- --locked

  setup:browser:
    desc: "Explicitly provision the pinned Playwright Chromium browser"
    dir: app
    cmds:
      - pnpm exec playwright install chromium

  setup:images:
    desc: "Explicitly pull infrastructure and build stable local images"
    cmds:
      - "{{.COMPOSE}} --profile '*' pull --ignore-buildable"
      - "{{.COMPOSE}} --profile '*' build api migrate bootstrap seed-accounts"

  dev:
    desc: "Prepared stack with local accounts, then foreground frontend; no installs/generation/builds"
    cmds:
      - node app/scripts/local-dev.mjs --mode real --credentials "$KAITEN_DEV_DIR" --check
      - task: up
      - task: app

  dev:mock:
    desc: "Explicit UI-only mock convenience; not backend readiness"
    cmds:
      - node app/scripts/local-dev.mjs --mode mock --port "${KAITEN_APP_PORT:-3000}"

  quickstart:
    desc: "Explicit demo fixture population after prepared backend readiness"
    cmds:
      - task: up
      - task: seed

  seed:
    desc: "Explicit demo fixtures; never replay bootstrap dependencies"
    cmds:
      - task: ready
        vars: { ACCOUNT_ONESHOTS: "seed-accounts tokens" }
      - "{{.COMPOSE}} run --rm --no-deps --no-build --pull never seed-data"

  up:
    desc: "Prepared backend and local accounts, no demo reseed"
    cmds:
      - task: stack
        vars: { PROFILES: "--profile accounts", ACCOUNT_ONESHOTS: "seed-accounts tokens" }

  up:bare:
    desc: "Prepared backend without local accounts; first login provisions them"
    cmds:
      - task: stack

  stack:
    internal: true
    cmds:
      - sh -c 'umask 077; mkdir -p "$KAITEN_DEV_DIR"'
      - "{{.COMPOSE}} {{.PROFILES}} up -d --no-build --pull never"
      - task: ready
        vars: { ACCOUNT_ONESHOTS: "{{.ACCOUNT_ONESHOTS}}" }

  ready:
    internal: true
    env: { LOCAL_COMPOSE: "{{.COMPOSE}}" }
    cmds:
      - node "{{.TASKFILE_DIR}}/scripts/local-ready.mjs" --services "{{.READY_SERVICES}}" --one-shots "{{.ONESHOT_SERVICES}} {{.ACCOUNT_ONESHOTS}}" --urls "{{.READY_URLS}}"
      - echo "Selected gateway is ready; task app serves the frontend"

  # ─────────────────────────────────────────────────────────────────────────────
  # Stack
  # ─────────────────────────────────────────────────────────────────────────────

  stop:
    desc: "Stop selected runtime; retain containers, data and credentials"
    cmds:
      - "{{.COMPOSE}} --profile '*' stop"

  down:
    desc: "Alias for stop (retains data)"
    cmds:
      - task: stop

  down:clean:
    desc: "Stop everything and delete all data (volumes)"
    cmds:
      - "{{.COMPOSE}} --profile '*' down -v --remove-orphans"

  reset:
    desc: "Throw the database away and rebuild from scratch"
    cmds:
      - task: down:clean
      - sh -c 'umask 077; mkdir -p "$KAITEN_DEV_DIR"'
      - "{{.COMPOSE}} up -d --no-build --pull never migrate"
      - LOCAL_COMPOSE='{{.COMPOSE}}' node scripts/local-ready.mjs --services db --one-shots migrate --no-http
      - "{{.COMPOSE}} run --rm --no-deps --no-build --pull never bootstrap rotate"
      - task: quickstart

  restart:
    desc: "Explicitly rebuild/restart only api; independent sidecar remains running (CDC proof required)"
    cmds:
      - "{{.COMPOSE}} build api"
      - "{{.COMPOSE}} up -d --no-build --pull never --no-deps api"
      - task: ready

  setup:debug:
    desc: "Explicitly provision pinned Delve locally (no global profile writes)"
    env: { GOBIN: "{{.TASKFILE_DIR}}/api/bin" }
    cmds:
      - go install github.com/go-delve/delve/cmd/dlv@v1.27.2

  debug:
    desc: "Explicit dev-only Delve build/start for SERVICE=api; gateway and infrastructure preserved"
    vars: { SERVICE: '{{default "api" .SERVICE}}' }
    env:
      KAITEN_DEBUG_PORT: '{{default "40000" .KAITEN_DEBUG_PORT}}'
    preconditions:
      - sh: test "{{.SERVICE}}" = api
        msg: "Unknown debug service; OSS supports only SERVICE=api (no runtime changed)"
    cmds:
      - '{{.COMPOSE}} -f "{{.TASKFILE_DIR}}/compose.debug.yml" build api'
      - '{{.COMPOSE}} -f "{{.TASKFILE_DIR}}/compose.debug.yml" up -d --no-deps --no-build --pull never api'
      - task: ready
      - echo "Attach Delve/IDE on 127.0.0.1:{{default "40000" .KAITEN_DEBUG_PORT}}; source map /go/kaiten/api to this checkout/api"

  debug:test:
    desc: "Debug one Go test package; Docker-capable TestMain may require Docker"
    dir: api
    vars: { PACKAGE: '{{default "" .PACKAGE}}' }
    preconditions:
      - sh: test -n "{{.PACKAGE}}"
        msg: "Pass PACKAGE=./pkg/...; inspect its TestMain for Docker prerequisites"
      - sh: test -x bin/dlv
        msg: "Explicitly run task setup:debug first (pinned Delve v1.27.2)"
    cmds:
      - 'bin/dlv test "{{.PACKAGE}}" --headless --listen=127.0.0.1:{{default "40000" .KAITEN_DEBUG_PORT}} --api-version=2 --accept-multiclient -- {{.CLI_ARGS}}'

  credentials:rotate:
    desc: "Explicit recovery/rotation: revokes local platform token and its children"
    cmds:
      - "{{.COMPOSE}} run --rm --no-deps --no-build --pull never bootstrap rotate"

  status:
    desc: "Normal accounts stack readiness; use ACCOUNT_ONESHOTS='' for bare mode"
    vars: { ACCOUNT_ONESHOTS: "seed-accounts tokens" }
    env: { LOCAL_COMPOSE: "{{.COMPOSE}}" }
    cmds:
      - node "{{.TASKFILE_DIR}}/scripts/local-ready.mjs" --status --services "{{.READY_SERVICES}}" --one-shots "{{.ONESHOT_SERVICES}} {{.ACCOUNT_ONESHOTS}}" --urls "{{.READY_URLS}}"

  ps:
    desc: "What is running"
    cmds:
      - "{{.COMPOSE}} --profile '*' ps -a"

  logs:
    desc: "Bounded logs (last 100 lines/10 minutes): task logs -- api"
    cmds:
      - "{{.COMPOSE}} logs --tail 100 --since 10m {{.CLI_ARGS}}"

  logs:follow:
    desc: "Explicit log follow: task logs:follow -- api"
    cmds:
      - "{{.COMPOSE}} logs --tail 100 -f {{.CLI_ARGS}}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────────────────────

  app:
    desc: "Foreground console; local auth by default, explicit LOCAL_AUTH=false preserves provider mode"
    vars: { LOCAL_AUTH: '{{default "true" .LOCAL_AUTH}}' }
    cmds:
      - |
        if [ "{{.LOCAL_AUTH}}" = false ]; then
          # Explicit advanced provider mode; installed tooling only, no lookup/install.
          cd "{{.TASKFILE_DIR}}/app"
          VITE_LOCAL_AUTH=false VITE_API_URL="${VITE_API_URL:-http://localhost:${KAITEN_PORT:-6060}/api}" \
            ../node_modules/.bin/vp dev --host 127.0.0.1 --strictPort --port "${KAITEN_APP_PORT:-3000}"
        else
          node "{{.TASKFILE_DIR}}/app/scripts/local-dev.mjs" --mode real --credentials "$KAITEN_DEV_DIR" \
            --api-url "http://localhost:${KAITEN_PORT:-6060}/api" --port "${KAITEN_APP_PORT:-3000}"
        fi

  app:clerk:
    desc: "Explicit advanced provider frontend; configured public env only, no install/credential lookup"
    cmds:
      - task: app
        vars: { LOCAL_AUTH: "false" }

  browser:
    desc: "Interactive fresh browser: task browser -- http://localhost:3000 [--devtools-port 9222]"
    cmds:
      - node app/scripts/local-browser.mjs --interactive {{.CLI_ARGS}}

  capture:
    desc: "Private screenshot and bounded failure evidence: task capture -- http://localhost:3000"
    cmds:
      - node app/scripts/local-browser.mjs {{.CLI_ARGS}}

  # ─────────────────────────────────────────────────────────────────────────────
  # Code generation
  # ─────────────────────────────────────────────────────────────────────────────

  generate:
    desc: "Go source → openapi.yaml → TypeScript SDK + GraphQL types"
    cmds:
      - task: generate:oas
      - |
        {{.NVM}}
        cd "{{.TASKFILE_DIR}}/app"
        nvm use
        pnpm run generate

  generate:oas:
    desc: "The Core and Platform OpenAPI specs from Go source"
    dir: api
    cmds:
      - go run cmd/docs/main.go openapi | tee openapi.yaml ../app/openapi.yaml > /dev/null
      # The Platform API is a second document, not a section of the first. Only
      # app/ carries it: nothing generates a client from it inside api/, and the
      # committed copy is what sdk-go's platform package is generated from.
      - go run cmd/docs/main.go platform-openapi | tee ../app/platform-openapi.yaml > /dev/null

  generate:sqlc:
    desc: "sqlc query helpers from SQL"
    dir: api
    cmds:
      # One sqlc.yaml per module / infrastructure package — sqlc resolves the
      # `schema` and `queries` paths relative to the config it is handed, so
      # each one has to be generated on its own. `go tool sqlc` pins the
      # version through go.mod, like gqlgen; a bare `sqlc` off PATH does not.
      - |
        set -eu
        find internal -name sqlc.yaml | sort | while read -r config; do
          go tool sqlc generate -f "$config"
        done

  generate:gqlgen:
    desc: "GraphQL resolvers and models"
    dir: api
    cmds:
      - go generate ./...

  generate:sdk-go:
    # Feeds the sdk-go generator the same committed 3.1 spec that
    # .github/workflows/release-openapi.yml publishes. CI does not run this, and
    # sdk-go has no drift gate yet: run it after a contract change.
    desc: "Regenerate the standalone Go SDK from app/openapi.yaml"
    vars:
      SDK_GO_DIR: '{{default (printf "%s/../sdk-go" .TASKFILE_DIR) .SDK_GO_DIR}}'
    preconditions:
      - sh: test -f "{{.SDK_GO_DIR}}/Taskfile.yml"
        msg: "Standalone sdk-go checkout not found at {{.SDK_GO_DIR}}; set SDK_GO_DIR"
    cmds:
      - task: generate:oas
      - task --dir "{{.SDK_GO_DIR}}" generate OPENAPI_SPEC="{{.TASKFILE_DIR}}/app/openapi.yaml"

  schema-docs:
    desc: "Regenerate schema documentation"
    dir: api/cmd/schema-docs
    env:
      PROJECT_ROOT: "{{.TASKFILE_DIR}}"
    cmds:
      - go run .

  # ─────────────────────────────────────────────────────────────────────────────
  # Tests and linting
  # ─────────────────────────────────────────────────────────────────────────────

  test:
    desc: "Every test, backend, frontend and charts"
    cmds:
      - task: deps:check
      - task: test:api
      - task: test:app
      - task: test:charts
      - task: test:local

  test:api:
    desc: "Backend tests — extra go test flags pass through: task test:api -- -v -run Usage"
    dir: api
    cmds:
      # -shuffle=on is the only guard in the repo against a test that passes
      # only because an earlier one left state behind. CI runs the same flag.
      - for: { var: MODULES }
        cmd: cd "{{.ITEM}}" && go test -shuffle=on {{.CLI_ARGS}} ./...

  test:api:race:
    desc: "Both Go modules with race detector; filters pass through (Docker integration prerequisites apply)"
    dir: api
    cmds:
      - for: { var: MODULES }
        cmd: cd "{{.ITEM}}" && go test -race -shuffle=on {{.CLI_ARGS}} ./...

  test:local:
    desc: "Workflow fixtures without Docker, browser, installs or credentials"
    cmds:
      - node --test scripts/local-ready.test.mjs scripts/local-compose.test.mjs app/scripts/local-development.test.mjs

  test:app:e2e:
    desc: "Existing Playwright regressions (installed browser and prepared clients required)"
    dir: app
    cmds:
      - pnpm run test:e2e:app {{.CLI_ARGS}}

  test:app:
    desc: "Frontend unit tests"
    dir: app
    cmds:
      - pnpm run test {{.CLI_ARGS}}

  test:charts:
    desc: "Lint and render the Helm charts (needs helm, no cluster)"
    cmds:
      # helm's own two commands. charts/kaiten renders from stock values;
      # charts/kaiten-infra will not render until it has been told where the
      # database credential comes from, and naming a Secret is the shorter of
      # the two ways to answer that.
      #
      # examples/minimal-values.yaml gets both commands too. An example nobody
      # renders is an example that rots, and this one is the first-install path.
      - helm lint charts/kaiten
      - helm template kaiten charts/kaiten >/dev/null
      - helm lint charts/kaiten -f charts/kaiten/examples/minimal-values.yaml
      - >-
        helm template kaiten charts/kaiten
        -f charts/kaiten/examples/minimal-values.yaml >/dev/null
      - >-
        helm lint charts/kaiten-infra
        --set migrate.database.existingSecret=example-db
        --set debeziumServer.database.existingSecret=example-db
      - >-
        helm template kaiten-infra charts/kaiten-infra
        --set migrate.database.existingSecret=example-db
        --set debeziumServer.database.existingSecret=example-db >/dev/null

  deps:check:
    desc: "Refuse a dependency on any other Kaiten module but the Go SDK (kaiten is depended on; it never depends back)"
    cmds:
      # The module GRAPH rather than the import list, so a `replace` left behind
      # after a local experiment fails the same way a real import does. Both
      # modules by name: `go ... ./...` stops at a nested one. What is allowed
      # under github.com/kaitencloud/: this repository's own modules and the
      # public Go SDK; anything else is a decision to make, not a `go get`.
      - |
        set -eu
        for module in api api/cmd/schema-docs; do
          graph=$(cd "$module" && go list -m all)
          if printf '%s\n' "$graph" | grep -E '^github\.com/kaitencloud/' | grep -v -E '^github\.com/kaitencloud/(kaiten/|sdk-go( |$))'; then
            echo "$module depends on a Kaiten module other than the Go SDK — kaiten is depended on, it never depends back" >&2
            exit 1
          fi
        done

  lint:
    desc: "Read-only lint, backend and frontend"
    cmds:
      - task: lint:api
      - task: lint:app

  # Bare names that forward to the backend task. Each job has a language suffix
  # because there are two languages here, but the word you type should not
  # depend on that, so the bare name exists and forwards.
  fmt:
    desc: "Format, backend"
    cmds:
      - task: fmt:api

  vuln:
    desc: "Known vulnerabilities, backend"
    cmds:
      - task: vuln:api

  deadcode:
    desc: "Unreachable functions, backend"
    cmds:
      - task: deadcode:api

  coverage:
    desc: "Coverage profile, backend"
    cmds:
      - task: coverage:api

  lint:api:
    desc: "Read-only golangci-lint over both modules (task setup:tools first)"
    dir: api
    env: { GOTOOLCHAIN: local }
    preconditions:
      - sh: go version | grep -q 'go1.27.1 '
        msg: "Select already-installed Go 1.27.1 for pinned lint (existing CI export-data constraint); no automatic download"
      - sh: test -x bin/golangci-lint
        msg: "Explicitly run task setup:tools first"
    cmds:
      - for: { var: MODULES }
        cmd: >-
          cd "{{.ITEM}}" &&
          "{{.TASKFILE_DIR}}/api/bin/golangci-lint" run --timeout=10m ./...

  build:
    desc: "Build owning Go commands/nested module and frontend using prepared tooling"
    cmds:
      - task: build:api
      - task: build:app

  build:app:
    dir: app
    cmds:
      - pnpm run build

  build:api:
    desc: "Build server, admin tools, seeder, docs and nested schema-docs into api/bin/"
    dir: api
    cmds:
      - go build -o bin/api ./cmd/server
      - go build -o bin/kaiten-admin-tools ./cmd/admin-tools
      - go build -o bin/seeder ./cmd/seeder
      - go build -o bin/docs ./cmd/docs
      - cd cmd/schema-docs && go build -o ../../bin/schema-docs .

  fmt:api:
    desc: "gofumpt + gci over both Go modules"
    dir: api
    cmds:
      - for: { var: MODULES }
        cmd: >-
          cd "{{.ITEM}}" &&
          "{{.TASKFILE_DIR}}/api/bin/golangci-lint" fmt ./...

  vuln:api:
    desc: "govulncheck over both Go modules"
    dir: api
    cmds:
      - for: { var: MODULES }
        cmd: >-
          cd "{{.ITEM}}" &&
          "{{.TASKFILE_DIR}}/api/bin/govulncheck" ./...

  deadcode:api:
    desc: "Unreachable functions, both Go modules (findings need triage, not blind deletion)"
    dir: api
    cmds:
      - for: { var: MODULES }
        cmd: >-
          cd "{{.ITEM}}" &&
          "{{.TASKFILE_DIR}}/api/bin/deadcode" -test ./...

  coverage:api:
    desc: "Coverage in both Go modules (Docker integration prerequisites apply)"
    dir: api
    cmds:
      # Unit and integration shards together: ./... is both, and the
      # integration half needs Docker for testcontainers.
      - for: { var: MODULES }
        cmd: cd "{{.ITEM}}" && go test {{.CLI_ARGS}} ./... -coverprofile=coverage.out -covermode=atomic

  lint:app:
    dir: app
    cmds:
      - pnpm run lint

  lint:fix:
    desc: "Explicit auto-fix, backend and frontend"
    cmds:
      - task: lint:api:fix
      - task: lint:app:fix

  lint:api:fix:
    dir: api
    env: { GOTOOLCHAIN: local }
    preconditions:
      - sh: go version | grep -q 'go1.27.1 '
        msg: "Select already-installed Go 1.27.1 for pinned lint (existing CI export-data constraint)"
      - sh: test -x bin/golangci-lint
        msg: "Explicitly run task setup:tools first"
    cmds:
      - for: { var: MODULES }
        cmd: cd "{{.ITEM}}" && "{{.TASKFILE_DIR}}/api/bin/golangci-lint" run --timeout=10m --fix ./...

  lint:app:fix:
    dir: app
    cmds:
      - pnpm run lint:fix
