worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use /tmp for all temp paths (writable by non-root)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback. index.html and the files copied from public/ keep the
        # same name from one build to the next, so browsers revalidate them on
        # every use (a 304 when nothing changed) instead of caching them blindly.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # A request for a static file outside /assets/ (public/ files such as
        # the favicon, images or /wasm/cel-engine.js) is a 404 when the file is
        # missing, rather than index.html served as that file.
        location ~* \.(js|mjs|css|map|json|txt|wasm|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Every file Vite emits under /assets/ has a content hash in its name:
        # a new build is served under new URLs, so these can be cached for good.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Except the runtime configuration chunk. Its hash is computed at build
        # time over placeholders, and docker-entrypoint.sh rewrites its content
        # at every start, so one URL carries different values from one
        # deployment to the next. The rewrite changes its ETag and
        # Last-Modified, so revalidating is enough to pick up new values.
        # Longest prefix wins, so this beats /assets/ above; ^~ on both keeps
        # the regex location above out of /assets/.
        location ^~ /assets/runtime-config- {
            add_header Cache-Control "no-cache";
        }
    }
}
