          type: string
        entitlementSlug:
          description: URL-friendly identifier for the entitlement
          examples:
            - premium-support
          format: string
          type: string
        entitlementType:
          description: Type of entitlement (BOOLEAN, NUMBER, or CONFIG)
          enum:
            - BOOLEAN
            - NUMBER
            - CONFIG
          examples:
            - NUMBER
          readOnly: true
          type: string
        licenseId:
          description: Unique identifier for the license this entitlement belongs to
          examples:
            - a1b2c3d4-e5f6-7g8h-9i0j-k1l2m3n4o5p6
          readOnly: true
          type: string
        licenseSlug:
          description: URL-friendly identifier for the license this entitlement belongs to
          examples:
            - enterprise-license
          readOnly: true
          type: string
        limitCapExceededOveragePercent:
          description: "Derives this grant's enforcement from its own numeric value: -1 when the value is unlimited (no cap, no overage); otherwise 0 rejects usage above the value (hard limit) and a positive percentage allows usage to exceed it by that much before being rejected (soft limit). Null for non-numeric (BOOLEAN/CONFIG) grants."
