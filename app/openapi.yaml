      additionalProperties: false
      properties:
        boundaryAt:
          description: The boundary the invoice bills. With the kind, it identifies the invoice within its subscription
          format: date-time
          type: string
        collectionMethod:
          enum:
            - SEND_INVOICE
            - CHARGE_AUTOMATICALLY
          type: string
        createdAt:
          format: date-time
          type: string
        currency:
          examples:
            - EUR
          type: string
