  /v1/notifications:
    get:
      description: Returns the signed-in user's notification feed, newest first, with the unread count. Notifications are a view over this organization's audit trail, narrowed to the events the user subscribes to; the id of a notification is the id of the audit trail entry it reports.
      operationId: listNotifications
      parameters:
        - description: Which notifications to return (default all)
          explode: false
          in: query
          name: status
          schema:
            description: Which notifications to return (default all)
            enum:
              - all
              - unread
            type: string
        - description: "Only notifications about these kinds of object; repeat the parameter for several (default: all)"
          explode: true
          in: query
          name: objectType
          schema:
            description: "Only notifications about these kinds of object; repeat the parameter for several (default: all)"
            items:
              enum:
                - instance
                - customer
                - release
                - deployment_zone
                - component
                - license
                - token
              type: string
            type:
              - array
              - "null"
        - description: Opaque cursor from a previous response's next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous response's next_cursor
            type: string
        - description: Page size (default 20, max 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (default 20, max 50)
            format: int32
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth:
            - read:notifications
      summary: List the caller's notifications
      tags:
        - notifications
  /v1/notifications/mark-read:
    post:
      description: "Marks the given notifications read for the signed-in user, or all of them with all: true. Ids belonging to another organization are ignored rather than rejected, so a retry of a partially applied call is safe."
