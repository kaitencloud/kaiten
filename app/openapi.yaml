          format: int32
          type: integer
        discountTotal:
          description: Sum of the discounts, in minor units
          format: int64
          type: integer
        dueAt:
          description: issuedAt + daysUntilDue
          format: date-time
          type: string
        externalReference:
          type: string
        handoffStatus:
          description: "PENDING: waiting in the handoff queue for the organization's accounting system"
          enum:
            - NOT_REQUIRED
            - PENDING
            - ACKNOWLEDGED
          type: string
        holdReason:
          description: "Why a DRAFT is held: the usage journal it was measured from failed a consistency check"
          enum:
            - LEDGER_SEQUENCE_GAP
            - LEDGER_CHAIN_BREAK
            - LEDGER_COUNTER_MISMATCH
          type: string
        id:
          description: "The invoice's identifier: the key an accounting system deduplicates on"
          type: string
        instanceName:
          type: string
        instanceSlug:
          type: string
        issuedAt:
          format: date-time
          type: string
        kind:
          description: ACTIVATION bills a subscription's first period, RENEWAL the period that ended and the one that starts, FINAL what is left when a subscription ends
          enum:
            - ACTIVATION
            - RENEWAL
            - FINAL
          type: string
        licenseSlug:
          type: string
        note:
          description: The note given when it was marked paid, kept only here
          type: string
        paidAt:
          format: date-time
          type: string
        providerKind:
          description: "Who collects it. NOOP: the organization itself, through the handoff queue"
          enum:
            - NOOP
            - STRIPE
          type: string
        serviceFrom:
          description: Earliest start of its lines' service periods
          format: date-time
          type: string
        serviceTo:
          description: Latest end of its lines' service periods
          format: date-time
          type: string
        source:
          description: "MARK_PAID: recorded by the organization. ZERO_TOTAL: nothing was owed"
          enum:
            - MARK_PAID
            - PROVIDER
            - ZERO_TOTAL
          type: string
        status:
          description: "MANUAL: issued, for the organization to collect. PAID, UNCOLLECTIBLE and VOID are final. DRAFT: held, waiting for a release or a recompose"
          enum:
            - DRAFT
            - PUSHED
            - PUSH_FAILED
            - MANUAL
            - PAID
            - PAYMENT_FAILED
            - UNCOLLECTIBLE
            - VOID
          type: string
        subtotal:
          description: Sum of the lines, in minor units
          format: int64
          type: integer
        total:
          description: subtotal − discountTotal, in minor units
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
      required:
        - source
        - id
        - kind
        - boundaryAt
        - serviceFrom
        - serviceTo
        - status
        - providerKind
        - collectionMethod
        - currency
        - subtotal
        - discountTotal
        - total
        - customerSlug
        - customerName
        - instanceSlug
        - instanceName
        - licenseSlug
        - handoffStatus
        - createdAt
        - updatedAt
      type: object
