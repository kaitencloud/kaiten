    get:
      description: "Streams the invoices the filters of listInvoices select, as CSV or NDJSON. Amounts are integer minor units with the currency's exponent beside them, so a spreadsheet never sees a float. The export carries billing e-mails: it is an authenticated read for the organization's accounting. Requires billing to be enabled for the organization."
      operationId: exportInvoices
      parameters:
        - description: Only invoices in these statuses; repeat the parameter for several
          explode: true
          in: query
          name: status
          schema:
            description: Only invoices in these statuses; repeat the parameter for several
            items:
              enum:
                - DRAFT
                - PUSHED
                - PUSH_FAILED
                - MANUAL
                - PAID
                - PAYMENT_FAILED
                - UNCOLLECTIBLE
                - VOID
              type: string
            type:
              - array
              - "null"
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - ACTIVATION
              - RENEWAL
              - FINAL
            type: string
        - explode: false
          in: query
          name: providerKind
          schema:
            enum:
              - NOOP
              - STRIPE
            type: string
        - description: "Only this customer's invoices: composed under this slug, or of the customer that has it now"
          explode: false
          in: query
          name: customerSlug
          schema:
