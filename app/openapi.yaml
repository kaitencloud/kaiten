components:
  schemas:
    Addon:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          readOnly: true
          type: string
        description:
          type: string
        familySlug:
          description: The family the version belongs to
          examples:
            - extra-seats
          type: string
        id:
          readOnly: true
          type: string
        isDefault:
          description: The version the family resolves to. Only a PUBLISHED version.
          type: boolean
        lifecycleState:
          description: A DRAFT can be attached to try it; an ARCHIVED version stays on the instances holding it but cannot be attached again.
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          type: string
        maxQuantity:
          description: The largest quantity an instance can hold; unbounded when absent
          examples:
            - 10
          format: int32
          type: integer
        name:
          examples:
            - Extra seats
          type: string
        pricingType:
          enum:
            - FREE
            - PAID
            - CUSTOM
          type: string
        slug:
          description: The version's slug, unique in the organization
          examples:
            - extra-seats-v1
          type: string
        updatedAt:
          format: date-time
          readOnly: true
          type: string
        version:
          description: The version number in its family, assigned on create
          examples:
            - 1
          format: int32
          readOnly: true
          type: integer
        versionName:
          examples:
            - Version - 1
          type: string
      required:
        - id
        - slug
        - familySlug
        - name
        - description
        - version
        - versionName
        - isDefault
        - lifecycleState
        - pricingType
        - createdAt
        - updatedAt
      type: object
    AddonChanges:
      additionalProperties: false
      properties:
        description:
          type: string
        isDefault:
          type: boolean
        maxQuantity:
          format: int32
          type: integer
        name:
          examples:
            - Extra seats
          minLength: 1
          type: string
        versionName:
          type: string
      required:
        - name
        - description
        - isDefault
      type: object
    AddonEntitlement:
      additionalProperties: false
      properties:
        entitlementSlug:
          examples:
            - seats
          type: string
        entitlementType:
          enum:
            - BOOLEAN
            - NUMBER
            - CONFIG
            - NUMBER_AI_CREDIT
          type: string
        id:
          readOnly: true
          type: string
        limitCapExceededOveragePercent:
          description: The overage the add-on allows; absent inherits the licence grant's
          format: int32
          type: integer
        overrideBehavior:
          description: "How a number grant combines with the licence's: ADD sums value × quantity, OVERRIDE replaces it with the latest attached add-on's, MAX keeps the larger. A boolean always ORs, a config always overrides."
          enum:
            - ADD
            - OVERRIDE
            - MAX
          type: string
        value:
          additionalProperties: {}
          description: "{type, value}, shaped like a licence grant. A number counts once per unit of quantity."
          type: object
      required:
        - id
        - entitlementSlug
        - entitlementType
        - value
        - overrideBehavior
      type: object
    AddonFamily:
      additionalProperties: false
      properties:
        currentVersion:
          $ref: "#/components/schemas/Addon"
          description: The default version, else the highest PUBLISHED one; absent when none is published
        id:
          readOnly: true
          type: string
        isPublic:
          description: Whether the family is listed in the public catalogue
          type: boolean
        lastVersion:
          description: The highest version number the family has assigned
          format: int32
          type: integer
        slug:
          examples:
            - extra-seats
          type: string
        versions:
          description: Every version, newest first
          items:
            $ref: "#/components/schemas/Addon"
          type:
            - array
            - "null"
      required:
        - id
        - slug
        - isPublic
        - lastVersion
        - versions
      type: object
    AddonFamilyVisibility:
      additionalProperties: false
      properties:
        isPublic:
          description: List the family's default PUBLISHED version, with its ACTIVE prices, in the public catalogue
          type: boolean
      required:
        - isPublic
      type: object
    AddonGrant:
      additionalProperties: false
      properties:
        limitCapExceededOveragePercent:
          description: "The overage the add-on allows: -1 with an unlimited value, 0 or more otherwise. Absent inherits the licence grant's."
          format: int32
          type: integer
        overrideBehavior:
          default: MAX
          description: How a number grant combines with the licence's
          enum:
            - ADD
            - OVERRIDE
            - MAX
          type: string
        value:
          additionalProperties: {}
          description: "{type, value}, shaped like a licence grant: a number counts once per unit of quantity"
          examples:
            - type: number
              value: 5
          type: object
      required:
        - value
      type: object
    AddonGrantUpdate:
      additionalProperties: false
      properties:
        addonSlug:
          description: The add-on version the grant belongs to
          type: string
        entitlementSlug:
          examples:
            - seats
          type: string
        entitlementType:
          enum:
            - BOOLEAN
            - NUMBER
            - CONFIG
            - NUMBER_AI_CREDIT
          type: string
        id:
          readOnly: true
          type: string
        limitCapExceededOveragePercent:
          description: The overage the add-on allows; absent inherits the licence grant's
          format: int32
          type: integer
        overrideBehavior:
          description: "How a number grant combines with the licence's: ADD sums value × quantity, OVERRIDE replaces it with the latest attached add-on's, MAX keeps the larger. A boolean always ORs, a config always overrides."
          enum:
            - ADD
            - OVERRIDE
            - MAX
          type: string
        value:
          additionalProperties: {}
          description: "{type, value}, shaped like a licence grant. A number counts once per unit of quantity."
          type: object
      required:
        - addonSlug
        - id
        - entitlementSlug
        - entitlementType
        - value
        - overrideBehavior
      type: object
    AddonPriceUpdate:
      additionalProperties: false
      properties:
        addonSlug:
          description: The add-on version the price belongs to
          type: string
        billingModel:
          description: "FLAT_FEE: an amount per billing period. USAGE_BASED: an amount per sale unit of the metered entitlement's usage. OVERAGE: an amount per sale unit of the usage above the licence's limit."
          enum:
            - FLAT_FEE
            - USAGE_BASED
            - OVERAGE
          type: string
        billingPeriod:
          description: The period a FLAT_FEE price is charged for. Absent on metered prices, which bill on the subscription's period.
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
          type: string
        billingTiming:
          description: ADVANCE bills the period that starts; ARREARS the period that ended. Metered prices are always ARREARS.
          enum:
            - ADVANCE
            - ARREARS
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        currency:
          description: ISO 4217 code, upper case. One currency per licence version.
          examples:
            - EUR
          type: string
        deprecatedAt:
          description: When the price was deprecated
          format: date-time
          type: string
        displayLabel:
          description: The invoice line's label; a default is derived when absent.
          examples:
            - Pro plan
          type: string
        displayOrder:
          description: Order among the version's prices
          examples:
            - 0
          format: int32
          type: integer
        id:
          description: Unique identifier of the price
          readOnly: true
          type: string
        isDefault:
          description: The FLAT_FEE price picked for its billing period when none is named. At most one per period; only an ACTIVE FLAT_FEE price.
          type: boolean
        metered:
          $ref: "#/components/schemas/PriceMeter"
          description: What a metered price measures. Absent on FLAT_FEE prices.
        status:
          description: A DEPRECATED price keeps billing what is already pinned to it but is no longer offered.
          enum:
            - ACTIVE
            - DEPRECATED
          type: string
        unitAmount:
          description: unitAmountDecimal as an integer number of minor units, when it is one; absent otherwise.
          examples:
            - 2900
          format: int64
          type: integer
        unitAmountDecimal:
          description: "Amount in the currency's minor units (cents for EUR): per period for FLAT_FEE, per sale unit for metered prices. Up to 12 decimal places."
          examples:
            - "2900"
          type: string
        updatedAt:
          format: date-time
          readOnly: true
          type: string
      required:
        - addonSlug
        - id
        - billingModel
        - billingTiming
        - currency
        - unitAmountDecimal
        - displayOrder
        - isDefault
        - status
        - createdAt
        - updatedAt
      type: object
    AddonQuantity:
      additionalProperties: false
      properties:
        quantity:
          examples:
            - 3
          format: int32
          minimum: 1
          type: integer
      required:
        - quantity
      type: object
    AddonUpdate:
      additionalProperties: false
      properties:
        changedFields:
          description: The members the change touched, as the API names them
          items:
            type: string
          type:
            - array
            - "null"
        compatibleLicenseFamilies:
          description: The licence families the version fits after the change
          items:
            type: string
          type:
            - array
            - "null"
        createdAt:
          format: date-time
          readOnly: true
          type: string
        description:
          type: string
        familySlug:
          description: The family the version belongs to
          examples:
            - extra-seats
          type: string
        id:
          readOnly: true
          type: string
        isDefault:
          description: The version the family resolves to. Only a PUBLISHED version.
          type: boolean
        lifecycleState:
          description: A DRAFT can be attached to try it; an ARCHIVED version stays on the instances holding it but cannot be attached again.
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          type: string
        maxQuantity:
          description: The largest quantity an instance can hold; unbounded when absent
          examples:
            - 10
          format: int32
          type: integer
        name:
          examples:
            - Extra seats
          type: string
        pricingType:
          enum:
            - FREE
            - PAID
            - CUSTOM
          type: string
        slug:
          description: The version's slug, unique in the organization
          examples:
            - extra-seats-v1
          type: string
        updatedAt:
          format: date-time
          readOnly: true
          type: string
        version:
          description: The version number in its family, assigned on create
          examples:
            - 1
          format: int32
          readOnly: true
          type: integer
        versionName:
          examples:
            - Version - 1
          type: string
      required:
        - changedFields
        - compatibleLicenseFamilies
        - id
        - slug
        - familySlug
        - name
        - description
        - version
        - versionName
        - isDefault
        - lifecycleState
        - pricingType
        - createdAt
        - updatedAt
      type: object
    AuditTrail:
      additionalProperties: false
      properties:
        eventName:
          description: Event name (e.g. ENTITLEMENT_VALUE_GET)
          type: string
        eventType:
          description: Event type identifier (e.g. com.kaiten.instance.entitlement.v1.value_get)
          type: string
        id:
          description: Unique audit trail entry ID
          type: string
        instanceId:
          description: Instance UUID (present for instance-scoped events)
          type: string
        instanceSlug:
          description: Instance slug
          type: string
        payload:
          description: Event payload (JSON)
        timestamp:
          description: When the event occurred
          format: date-time
          type: string
      required:
        - id
        - instanceSlug
        - eventName
        - eventType
        - timestamp
      type: object
    Basic:
      additionalProperties: false
      properties:
        type:
          enum:
            - basic
          type: string
        value:
          type: string
      required:
        - type
        - value
      type: object
    BasicTargeting:
      additionalProperties: false
      properties:
        name:
          examples:
            - Targeting Rule 1
          type: string
        rule:
          description: CEL expression for basicTargeting evaluation
          examples:
            - user.group == 'beta'
          maxLength: 10000
          type: string
        type:
          enum:
            - basic
          type: string
        variant:
          type: string
      required:
        - type
        - name
        - variant
        - rule
      type: object
    BillingCapabilities:
      additionalProperties: false
      properties:
        disabledReason:
          description: "Why they do not: billing is off on this deployment, or the organization's plan does not include it"
          enum:
            - DEPLOYMENT_DISABLED
            - NOT_ENTITLED
          type: string
        enabled:
          description: Whether the billing routes answer for this organization
          type: boolean
        features:
          $ref: "#/components/schemas/BillingFeatures"
          description: Which parts of billing this release ships
        providers:
          description: Who can collect invoices
          items:
            $ref: "#/components/schemas/BillingProvider"
          type: array
        publicSurface:
          $ref: "#/components/schemas/PublicSurface"
        usageHistoryRetentionMonths:
          description: How long usage reports are kept, in months; absent when they are kept forever or it cannot be told
          format: int64
          type: integer
        usageIdempotencyWindowDays:
          description: How long a usage report's transactionId is remembered, in days
          format: int64
          type: integer
      required:
        - enabled
        - providers
        - publicSurface
        - usageIdempotencyWindowDays
        - features
      type: object
    BillingFeatures:
      additionalProperties: false
      properties:
        addons:
          type: boolean
        chargeAutomatically:
          type: boolean
        lifecycle:
          description: Cancellation, reactivation, plan changes and overdue tracking
          type: boolean
        publicSurface:
          type: boolean
        stripe:
          type: boolean
        trials:
          type: boolean
        vouchers:
          type: boolean
      required:
        - stripe
        - lifecycle
        - trials
        - addons
        - vouchers
        - chargeAutomatically
        - publicSurface
      type: object
    BillingHealth:
      additionalProperties: false
      properties:
        closeBacklog:
          $ref: "#/components/schemas/CloseBacklog"
          description: Subscriptions whose period ended and has not closed yet
        handoff:
          $ref: "#/components/schemas/HandoffBacklog"
        heldInvoices:
          $ref: "#/components/schemas/HeldInvoices"
        overdueInvoices:
          format: int64
          type: integer
        pastDueSubscriptions:
          format: int64
          type: integer
        providerSync:
          items:
            $ref: "#/components/schemas/ProviderSync"
          type: array
        pushFailures:
          $ref: "#/components/schemas/PushFailures"
          description: Invoices whose push failed at least as many times as the alert threshold
        reconciliationMismatches30d:
          description: Invoices whose provider's amounts differed from Kaiten's, in the last 30 days
          format: int64
          type: integer
      required:
        - closeBacklog
        - heldInvoices
        - pushFailures
        - reconciliationMismatches30d
        - providerSync
        - pastDueSubscriptions
        - overdueInvoices
        - handoff
      type: object
    BillingProvider:
      additionalProperties: false
      properties:
        available:
          description: Whether the organization may connect it on this deployment
          type: boolean
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        connected:
          description: Whether it is set up for the organization; NOOP always is
          type: boolean
        kind:
          enum:
            - NOOP
            - STRIPE
          type: string
        livemode:
          description: Whether the connection reaches the provider's live account rather than a test one; absent when not connected, and for NOOP
          type: boolean
        unavailableReason:
          description: Why it is not available; absent when it is
          enum:
            - NOT_ENTITLED
            - VAULT_NOT_CONFIGURED
          type: string
      required:
        - kind
        - available
        - connected
        - capabilities
      type: object
    BillingSettings:
      additionalProperties: false
      properties:
        defaultCollectionMethod:
          description: "How an invoice is collected when its subscription does not say: SEND_INVOICE sends it for payment. CHARGE_AUTOMATICALLY needs a payment provider and is refused until one is available."
          enum:
            - SEND_INVOICE
            - CHARGE_AUTOMATICALLY
          examples:
            - SEND_INVOICE
          type: string
        defaultDaysUntilDue:
          description: Days an invoice is due after it is issued, when its subscription does not say; 0 to 365.
          examples:
            - 30
          format: int32
          type: integer
        handoffStripeInvoices:
          description: Whether invoices a payment provider issues also enter the handoff queue, for an accounting system that wants every invoice. Invoices without a provider always do.
          type: boolean
      required:
        - defaultCollectionMethod
        - defaultDaysUntilDue
        - handoffStripeInvoices
      type: object
    BillingStarted:
      additionalProperties: false
      properties:
        anchorAt:
          description: The instant its periods are counted from
          format: date-time
          type: string
        basePrice:
          $ref: "#/components/schemas/Price"
          description: The FLAT_FEE price the subscription is pinned to, deprecated or not
        billingPeriod:
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
          type: string
        cancelAtPeriodEnd:
          type: boolean
        cancelRequestedAt:
          format: date-time
          type: string
        canceledAt:
          format: date-time
          type: string
        cancellationReason:
          type: string
        collectionMethod:
          description: "Effective: the subscription's own, else the organization's default"
          enum:
            - SEND_INVOICE
            - CHARGE_AUTOMATICALLY
          type: string
        collectionMethodOverride:
          description: The subscription's own collection method; absent when it takes the organization's
          type: string
        createdAt:
          format: date-time
          type: string
        currency:
          examples:
            - EUR
          type: string
        currentPeriodEnd:
          description: "The next boundary: the period closes, and its invoice is composed, after it"
          format: date-time
          type: string
        currentPeriodStart:
          format: date-time
          type: string
        customerName:
          type: string
        customerSlug:
          type: string
        daysUntilDue:
          description: "Effective: the subscription's own, else the organization's default"
          format: int32
          type: integer
        daysUntilDueOverride:
          description: The subscription's own payment terms; absent when it takes the organization's
          format: int32
          type: integer
        id:
          type: string
        instanceName:
          type: string
        instanceSlug:
          description: As it was at the subscription's last write
          type: string
        pastDueSince:
          format: date-time
          type: string
        providerKind:
          description: "Who collects its invoices. NOOP: the organization itself, through the handoff queue"
          enum:
            - NOOP
            - STRIPE
          type: string
        resubscribed:
          description: Set when a CANCELED subscription was subscribed again
          type: boolean
        scheduledChange:
          $ref: "#/components/schemas/ScheduledChange"
          description: A plan change waiting for the next boundary
        startedAt:
          description: "When billing started: usage before it is never billed"
          format: date-time
          type: string
        status:
          enum:
            - TRIAL
            - ACTIVE
            - PAST_DUE
            - CANCELED
          type: string
        trialEndsAt:
          description: "When the trial ends, or ended: usage before it is never billed"
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - resubscribed
        - id
        - instanceSlug
        - instanceName
        - customerSlug
        - customerName
        - status
        - providerKind
        - collectionMethod
        - daysUntilDue
        - basePrice
        - billingPeriod
        - currency
        - anchorAt
        - startedAt
        - currentPeriodStart
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - createdAt
        - updatedAt
      type: object
    BooleanEntitlementValue:
      additionalProperties: false
      properties:
        type:
          description: Value type discriminator
          enum:
            - boolean
          examples:
            - boolean
          type: string
        value:
          description: Boolean value
          examples:
            - true
          type: boolean
      required:
        - type
        - value
      type: object
    BulkEvaluationFailure:
      additionalProperties: false
      properties:
        errorCode:
          description: Error code specific to the bulk evaluation error
          type: string
        errorDetails:
          description: Optional error details description
          type: string
      required:
        - errorCode
      type: object
    BulkEvaluationRequest:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          type: object
      type: object
    CanceledSubscription:
