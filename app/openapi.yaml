          type: string
        voucherType:
          enum:
            - PRICE
            - ENTITLEMENT_BOOST
          type: string
      required:
        - id
        - codeHint
        - name
        - voucherType
        - status
        - duration
        - redemptionsCount
        - applicableLicensePriceIds
        - applicableAddonPriceIds
        - grants
        - applicableLicenseIds
        - applicableAddonIds
        - redemptionRules
        - createdAt
        - updatedAt
      type: object
    VoucherCheck:
      additionalProperties: false
      properties:
        code:
          examples:
            - SUMMER-2026-LAUNCH
          maxLength: 64
          minLength: 1
          type: string
        instanceSlug:
          description: Also run the checks that need the redeeming instance
          type: string
      required:
        - code
      type: object
    VoucherCode:
      additionalProperties: false
      properties:
        code:
          examples:
            - SUMMER-2026-LAUNCH
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
      type: object
    VoucherDraft:
      additionalProperties: false
      properties:
        applicableAddonIds:
          items:
            type: string
          type:
            - array
            - "null"
        applicableAddonPriceIds:
          description: "With SELECTED_PRICES: the add-on prices it discounts"
          items:
            type: string
          type:
            - array
            - "null"
        applicableLicenseIds:
          items:
            type: string
          type:
            - array
            - "null"
        applicableLicensePriceIds:
          description: "With SELECTED_PRICES: the licence prices it discounts"
          items:
            type: string
          type:
            - array
            - "null"
        code:
          description: "8 to 64 of [A-Za-z0-9_-]. Generated when absent: 16 characters, 80 random bits. Matched without case or separators."
          examples:
            - SUMMER-2026-LAUNCH
          type: string
        currency:
          description: Required with FIXED_AMOUNT, refused otherwise
          examples:
            - EUR
          type: string
        description:
          maxLength: 2000
          type: string
        duration:
          enum:
            - ONE_TIME
            - REPEATING
            - FOREVER
          type: string
        durationInPeriods:
          description: Required with REPEATING, refused otherwise
          format: int32
          type: integer
        expiresAt:
          format: date-time
          type: string
        grants:
          description: Required on an ENTITLEMENT_BOOST, refused on a PRICE voucher
          items:
            $ref: "#/components/schemas/Grant"
          type:
            - array
            - "null"
        maxRedemptions:
          format: int32
          minimum: 1
          type: integer
        name:
          examples:
            - Summer launch
          maxLength: 200
          minLength: 1
          type: string
        priceAppliesTo:
          enum:
            - LICENSE_BASE
            - ADDONS
            - BOTH
            - SELECTED_PRICES
          type: string
        priceDiscountType:
          enum:
            - PERCENTAGE
            - FIXED_AMOUNT
          type: string
        priceDiscountValue:
          description: A percentage in (0, 100], or an integer amount in minor units
          examples:
            - "30"
          type: string
        redemptionRules:
          $ref: "#/components/schemas/RedemptionRules"
        restrictedCustomerSlug:
          type: string
        startsAt:
          format: date-time
          type: string
        voucherType:
          enum:
            - PRICE
            - ENTITLEMENT_BOOST
          type: string
      required:
        - name
        - voucherType
        - duration
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "A JWT verified by the proxy in front of this API, or a Kaiten access token (`ksh_...`) — send either as `Authorization: Bearer <token>`. The scopes listed on each operation are the ones the token must carry; `write:<module>` implies `read:<module>`, and `read:*` / `write:*` are wildcards over every module. `x-kaiten-scopes` lists every scope such a token can carry, including those enforced by a service in front of this API rather than by one of its operations."
      scheme: bearer
      type: http
      x-kaiten-scopes:
        - read:addons
        - read:billing
        - read:components
        - read:customer_sessions
        - read:customers
        - read:deployment_zones
        - read:entitlements
        - read:feature_flags
        - read:instances
        - read:licenses
        - read:metadata_fields
        - read:notifications
        - read:organizations
        - read:publishable_keys
        - read:releases
        - read:tokens
        - read:voucher_redemptions
        - read:vouchers
        - read:webhooks
        - write:addons
        - write:billing
        - write:components
        - write:customer_sessions
        - write:customers
        - write:deployment_zones
        - write:entitlements
        - write:feature_flags
        - write:instances
        - write:licenses
        - write:metadata_fields
        - write:notifications
        - write:organizations
        - write:publishable_keys
        - write:releases
        - write:tokens
        - write:voucher_redemptions
        - write:vouchers
        - write:webhooks
    customerSession:
      bearerFormat: kst_
      description: "A customer session (`kst_...`), minted by the vendor's backend with POST /customer-sessions and sent as `Authorization: Bearer kst_...`. It acts for one customer -- and one of its instances, when bound -- on the /public/session routes and nowhere else. A browser request must come from an origin one of the organization's publishable keys allows."
      scheme: bearer
      type: http
    publishableKey:
      description: "A Kaiten publishable key (`pk_...`). Not a secret: it ships in web pages, and authorizes reading the organization's public catalogue and nothing else. A browser request must come from one of the key's allowed origins. Never send it as `Authorization`; a request carrying `Authorization` is refused."
      in: header
      name: X-Kaiten-Publishable-Key
      type: apiKey
