            description: Only issued invoices still unpaid past their due date
            type: boolean
        - description: Only DRAFTs held for their usage journal
          explode: false
          in: query
          name: held
          schema:
            description: Only DRAFTs held for their usage journal
            type: boolean
        - explode: false
          in: query
          name: handoffStatus
          schema:
            enum:
              - NOT_REQUIRED
              - PENDING
              - ACKNOWLEDGED
            type: string
        - description: Issued at or after this instant (RFC 3339)
          explode: false
          in: query
          name: issuedFrom
          schema:
            description: Issued at or after this instant (RFC 3339)
            format: date-time
            type: string
        - description: Issued before this instant (RFC 3339)
          explode: false
          in: query
          name: issuedTo
          schema:
            description: Issued before this instant (RFC 3339)
            format: date-time
            type: string
        - description: Billing a boundary at or after this instant
          explode: false
          in: query
          name: boundaryFrom
          schema:
