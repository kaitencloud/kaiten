          examples:
            - SUM
          type: string
        behavior:
          description: append adds the value through the aggregation method; set overwrites the counter
          enum:
            - append
            - set
          type: string
        delta:
          description: valueAfter minus valueBefore; negative for a set that lowered the counter
          examples:
            - "600"
          type: string
        entitlementId:
          description: The entitlement the report was made for. It may since have been deleted.
          format: uuid
          type: string
        eventCountAfter:
          description: Reports counted in the window after this one
          examples:
            - 1
          format: int32
          type: integer
        instanceId:
          description: The instance the report was made for. It may since have been deleted.
          format: uuid
          type: string
        licenseId:
          description: The instance's licence when the report was accepted
          format: uuid
          type: string
        limitValue:
          description: The limit in force when the report was accepted. Null when unlimited.
          examples:
            - "1000"
          type: string
        overageDelta:
          description: "How much the usage above limitValue moved: max(0, valueAfter - limitValue) - max(0, valueBefore - limitValue). 0 when unlimited."
          examples:
            - "0"
          type: string
        overagePercent:
          description: The overage allowed above limitValue, in percent, when the report was accepted. Null when unlimited.
          examples:
            - 50
          format: int32
          type: integer
        properties:
          additionalProperties: {}
          description: The report's metadata, when it was stored
          type: object
        reportSeq:
          description: Position of the report among the pair's accepted reports, from 1, without gaps
          examples:
            - 42
          format: int64
          type: integer
        reportedAt:
          description: When the server accepted the report (UTC, millisecond precision)
          examples:
            - "2026-10-05T08:00:00.000Z"
          format: date-time
          type: string
        reportedValue:
          description: "The value as sent: a delta for append, an absolute value for set"
          examples:
            - "600"
          type: string
        transactionId:
          description: The report's idempotency key, when it was sent with one
          examples:
            - llm-call-9f2c:tokens
          type: string
        valueAfter:
          description: The counter after the report
          examples:
            - "600"
          type: string
        valueBefore:
          description: The counter before the report, after any window reset
          examples:
            - "0"
          type: string
        windowEnd:
          description: End of the usage window the report counted in (exclusive). Null for a lifetime entitlement.
          format: date-time
          type: string
        windowStart:
          description: Start of the usage window the report counted in (inclusive). Null for a lifetime entitlement.
          format: date-time
          type: string
