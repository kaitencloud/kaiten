          format: date-time
          readOnly: true
          type: string
        currentVersion:
          $ref: "#/components/schemas/License"
          description: "The version this read is about. By default the version the family resolves to: its default version if it has one, otherwise its highest-numbered PUBLISHED version. Under ?version=N it is the version asked for instead, whatever its lifecycle state. Absent when the family has no PUBLISHED version, which only a list or an include=versions read returns."
