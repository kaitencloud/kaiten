        - description: Instance slug
          in: path
          name: instanceSlug
          required: true
          schema:
            description: Instance slug
            examples:
              - acme-prod
            type: string
        - description: Only invoices in these statuses; repeat the parameter for several
          explode: true
          in: query
          name: status
          schema:
            description: Only invoices in these statuses; repeat the parameter for several
            items:
              enum:
                - DRAFT
                - PUSHED
                - PUSH_FAILED
                - MANUAL
                - PAID
                - PAYMENT_FAILED
                - UNCOLLECTIBLE
                - VOID
              type: string
            type:
              - array
              - "null"
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - ACTIVATION
              - RENEWAL
              - FINAL
            type: string
        - explode: false
          in: query
          name: providerKind
          schema:
            enum:
              - NOOP
              - STRIPE
            type: string
        - description: "Only this customer's invoices: composed under this slug, or of the customer that has it now"
          explode: false
          in: query
          name: customerSlug
          schema:
            description: "Only this customer's invoices: composed under this slug, or of the customer that has it now"
            type: string
        - description: Only issued invoices still unpaid past their due date
          explode: false
          in: query
          name: overdue
