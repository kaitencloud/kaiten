          readOnly: true
          type: string
        isPublic:
          description: Whether the family's default PUBLISHED version is listed in the public catalogue. Private by default.
          type: boolean
        slug:
          description: URL-friendly identifier of the family, unique per organization and stable across renames and new versions. Deleting the family's last version deletes the family and frees the slug.
          examples:
            - enterprise-license
          type: string
        updatedAt:
          description: Timestamp when a version was last added to this family, or when the family was created. Renames, lifecycle moves and default changes update the versions' own updatedAt, not this one.
