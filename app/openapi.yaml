        - description: Entitlement slug
          in: path
          name: entitlementSlug
          required: true
          schema:
            description: Entitlement slug
            examples:
              - entitlement-slug
            type: string
        - description: Start of the range, inclusive (RFC 3339). Defaults to 30 days before to, moved up to the start of the organization's usage history when that is later. An explicit from before it answers 422 ExportUsageReports.OutsideRetention.
          explode: false
          in: query
          name: from
          schema:
            description: Start of the range, inclusive (RFC 3339). Defaults to 30 days before to, moved up to the start of the organization's usage history when that is later. An explicit from before it answers 422 ExportUsageReports.OutsideRetention.
            format: date-time
            type: string
        - description: End of the range, exclusive (RFC 3339). Defaults to now. At most 366 days after from.
          explode: false
          in: query
          name: to
          schema:
            description: End of the range, exclusive (RFC 3339). Defaults to now. At most 366 days after from.
            format: date-time
            type: string
        - description: "csv (the default): RFC 4180 with a header row. json: NDJSON, one report per line, in the shape listUsageReports returns. Anything else answers 422 ExportUsageReports.InvalidFormat."
          explode: false
          in: query
          name: format
