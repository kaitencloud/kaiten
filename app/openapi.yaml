      properties:
        anchorAt:
          description: The instant its periods are counted from
          format: date-time
          type: string
        basePrice:
          $ref: "#/components/schemas/Price"
          description: The FLAT_FEE price the subscription is pinned to, deprecated or not
        billingPeriod:
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
          type: string
        cancelAtPeriodEnd:
          type: boolean
        cancelRequestedAt:
          format: date-time
          type: string
        canceledAt:
          format: date-time
          type: string
        cancellationReason:
          type: string
        collectionMethod:
          description: "Effective: the subscription's own, else the organization's default"
          enum:
            - SEND_INVOICE
            - CHARGE_AUTOMATICALLY
          type: string
        collectionMethodOverride:
          description: The subscription's own collection method; absent when it takes the organization's
          type: string
        createdAt:
          format: date-time
          type: string
        currency:
          examples:
            - EUR
          type: string
        currentPeriodEnd:
          description: "The next boundary: the period closes, and its invoice is composed, after it"
          format: date-time
          type: string
        currentPeriodStart:
          format: date-time
          type: string
        customerName:
          type: string
        customerSlug:
          type: string
        daysUntilDue:
          description: "Effective: the subscription's own, else the organization's default"
          format: int32
          type: integer
        daysUntilDueOverride:
          description: The subscription's own payment terms; absent when it takes the organization's
          format: int32
          type: integer
        finalInvoice:
          $ref: "#/components/schemas/InvoiceSummary"
          description: The FINAL invoice of an immediate cancellation
        id:
          type: string
        instanceName:
          type: string
        instanceSlug:
          description: As it was at the subscription's last write
          type: string
        pastDueSince:
          format: date-time
          type: string
        providerKind:
          description: "Who collects its invoices. NOOP: the organization itself, through the handoff queue"
          enum:
            - NOOP
            - STRIPE
          type: string
        scheduledChange:
          $ref: "#/components/schemas/ScheduledChange"
          description: A plan change waiting for the next boundary
        startedAt:
          description: "When billing started: usage before it is never billed"
          format: date-time
          type: string
        status:
          enum:
            - TRIAL
            - ACTIVE
            - PAST_DUE
            - CANCELED
          type: string
        trialEndsAt:
          description: "When the trial ends, or ended: usage before it is never billed"
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - instanceSlug
        - instanceName
        - customerSlug
        - customerName
        - status
        - providerKind
        - collectionMethod
        - daysUntilDue
        - basePrice
        - billingPeriod
        - currency
        - anchorAt
        - startedAt
        - currentPeriodStart
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - createdAt
        - updatedAt
      type: object
    Cancellation:
      additionalProperties: false
      properties:
        anchorAt:
          description: The instant its periods are counted from
          format: date-time
          type: string
        basePrice:
          $ref: "#/components/schemas/Price"
          description: The FLAT_FEE price the subscription is pinned to, deprecated or not
        billingPeriod:
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
          type: string
        cancelAtPeriodEnd:
          type: boolean
        cancelRequestedAt:
          format: date-time
          type: string
        canceledAt:
          format: date-time
          type: string
        cancellationReason:
          type: string
        collectionMethod:
          description: "Effective: the subscription's own, else the organization's default"
          enum:
            - SEND_INVOICE
            - CHARGE_AUTOMATICALLY
          type: string
        collectionMethodOverride:
          description: The subscription's own collection method; absent when it takes the organization's
          type: string
        createdAt:
          format: date-time
          type: string
        currency:
          examples:
            - EUR
          type: string
        currentPeriodEnd:
          description: "The next boundary: the period closes, and its invoice is composed, after it"
          format: date-time
          type: string
        currentPeriodStart:
          format: date-time
          type: string
        customerName:
          type: string
        customerSlug:
          type: string
        daysUntilDue:
          description: "Effective: the subscription's own, else the organization's default"
          format: int32
          type: integer
        daysUntilDueOverride:
          description: The subscription's own payment terms; absent when it takes the organization's
          format: int32
          type: integer
        finalInvoiceId:
          description: The FINAL invoice, when the cancellation issued one
          type: string
        id:
          type: string
        instanceName:
          type: string
        instanceSlug:
          description: As it was at the subscription's last write
