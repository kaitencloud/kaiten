          format: int32
          type: integer
        updatedAt:
          description: Timestamp when this entitlement was last updated
          examples:
            - "2023-10-02T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        updatedBy:
          $ref: "#/components/schemas/User"
          description: User who last updated this entitlement
          readOnly: true
        value:
          description: "Typed entitlement value. Supported shapes: {type:number,value:number}, {type:boolean,value:boolean}, {type:object,value:{...}}"
          discriminator:
            mapping:
              boolean: "#/components/schemas/BooleanEntitlementValue"
