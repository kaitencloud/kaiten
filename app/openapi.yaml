          description: The line's identifier, stable for the invoice's life; absent on a preview
          type: string
        instanceAddonId:
          description: The instance's attachment an ADDON line bills
          type: string
        instanceVoucherId:
          description: The redemption a DISCOUNT line applies
          type: string
