        overage:
          $ref: "#/components/schemas/InvoiceLineOverage"
          description: The arithmetic of an OVERAGE line
        provider:
          $ref: "#/components/schemas/InvoiceLineProvider"
          description: The line in the payment provider, once pushed
        quantity:
          description: "In sale units, a decimal string: 1 on a BASE line, the quantity held on an ADDON line"
          examples:
            - "3.05"
          type: string
        seq:
          description: Position on the invoice, from 1
          format: int64
          type: integer
