    License:
      additionalProperties: false
      properties:
        createdAt:
          description: Timestamp when this license was created
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        description:
          description: Detailed description of the license capabilities and restrictions
          examples:
            - This license provides access to all enterprise features including advanced analytics, priority support, and unlimited users.
          maxLength: 500
          type: string
        familyId:
          description: "Identifier of the license family this license is a version of. Stable across renames and new versions: two licenses sharing it are the same product. Always present in responses. On create, optional: names the family this license is a new version of, as familySlug does by slug; omit both to create a new family. On update, optional and must be the license's own family: a version cannot move between families (UpdateLicense.FamilyNotReassignable)."
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        familySlug:
          description: "Write-only on create: slug of the family this license is a new version of. familyId names the same family by identifier; sent together they must agree. Omit both to create a new family, of which this license becomes version 1. Never returned -- see familyId. Refused on update: a version cannot move between families."
          examples:
            - enterprise-license
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
          writeOnly: true
        id:
          description: Unique identifier for the license
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        isDefault:
          description: "Whether this version is the one its family puts forward: at most one version per family, and only a PUBLISHED one (CreateLicense.DefaultMustBePublished, UpdateLicense.DefaultMustBePublished). Resolution hands it out ahead of the highest-numbered published version, so it keeps being served when a newer version is published. Setting it takes the flag from the family's previous default, which gets a LICENSE_UPDATED event of its own. On update, sending false unsets it; the default cannot be archived until another version takes its place or the flag is unset (ArchiveLicense.DefaultMustBePublished)."
          examples:
            - false
          type: boolean
        lifecycleState:
          description: Whether this version may be served. Always present in responses. Optional on create, where it is DRAFT or PUBLISHED and PUBLISHED when omitted; ARCHIVED is refused (CreateLicense.LifecycleStateNotSettable), since a version is archived by withdrawing it from sale. After that it changes only through publish-license (DRAFT to PUBLISHED), archive-license (PUBLISHED to ARCHIVED) and unarchive-license (ARCHIVED to PUBLISHED); update accepts the stored state and refuses any other (UpdateLicense.LifecycleStateNotSettable). Only a PUBLISHED version can be the family's default. An ARCHIVED version cannot be assigned to an instance (CreateInstance.LicenseArchived, UpdateInstance.LicenseArchived); instances already on it keep it.
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          examples:
            - PUBLISHED
          type: string
        name:
          description: Display name of the license
          examples:
            - Enterprise License
          maxLength: 100
          minLength: 1
          type: string
        slug:
          description: Optional URL-friendly identifier, unique per organization. When omitted, a new version of an existing family takes {familySlug}-v{version}, and any other license gets one generated from its name. A license that opens a new family gives the family its slug.
          examples:
            - enterprise-license
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        type:
          description: Type of the license determining its capabilities and restrictions
          enum:
            - DEVELOPMENT
            - TRIAL
            - PAID
            - COMMUNITY
          examples:
            - paid
          type: string
        updatedAt:
          description: Timestamp when this license was last updated
          examples:
            - "2023-10-02T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        version:
          description: "Version of the license within its family, assigned by the server when the version is created and never changed afterwards: the version's derived slug ({familySlug}-v{version}, see slug) is built from it. A number is never reused within a family, even after its version is deleted. Create refuses any value (CreateLicense.VersionNotSettable); update accepts only the stored one, so a representation can be written back as it was read (UpdateLicense.VersionNotSettable)."
          examples:
            - "1"
          readOnly: true
          type: string
        versionName:
          description: Optional human-readable name for the license version. Defaults to "Version - <version>".
          examples:
            - Winter 2024 Release
          maxLength: 50
          type: string
      required:
        - id
        - name
        - description
        - type
        - version
        - isDefault
        - createdAt
        - updatedAt
      type: object
