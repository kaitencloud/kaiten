components:
  schemas:
    AuditTrail:
      additionalProperties: false
      properties:
        eventName:
          description: Event name (e.g. ENTITLEMENT_VALUE_GET)
          type: string
        eventType:
          description: Event type identifier (e.g. com.kaiten.instance.entitlement.v1.value_get)
          type: string
        id:
          description: Unique audit trail entry ID
          type: string
        instanceId:
          description: Instance UUID (present for instance-scoped events)
          type: string
        instanceSlug:
          description: Instance slug
          type: string
        payload:
          description: Event payload (JSON)
        timestamp:
          description: When the event occurred
          format: date-time
          type: string
      required:
        - id
        - instanceSlug
        - eventName
        - eventType
        - timestamp
      type: object
    Basic:
      additionalProperties: false
      properties:
        type:
          enum:
            - basic
          type: string
        value:
          type: string
      required:
        - type
        - value
      type: object
    BasicTargeting:
      additionalProperties: false
      properties:
        name:
          examples:
            - Targeting Rule 1
          type: string
        rule:
          description: CEL expression for basicTargeting evaluation
          examples:
            - user.group == 'beta'
          maxLength: 10000
          type: string
        type:
          enum:
            - basic
          type: string
        variant:
          type: string
      required:
        - type
        - name
        - variant
        - rule
      type: object
    BooleanEntitlementValue:
      additionalProperties: false
      properties:
        type:
          description: Value type discriminator
          enum:
            - boolean
          examples:
            - boolean
          type: string
        value:
          description: Boolean value
          examples:
            - true
          type: boolean
      required:
        - type
        - value
      type: object
    BulkEvaluationFailure:
      additionalProperties: false
      properties:
        errorCode:
          description: Error code specific to the bulk evaluation error
          type: string
        errorDetails:
          description: Optional error details description
          type: string
      required:
        - errorCode
      type: object
    BulkEvaluationRequest:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          type: object
      type: object
    Command:
      additionalProperties: false
      properties:
        entitlementSlug:
          type: string
      required:
        - entitlementSlug
      type: object
    Component:
      additionalProperties: false
      properties:
        createdAt:
          description: Timestamp when the component was created
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        createdBy:
          $ref: "#/components/schemas/User"
          description: User who created this component
          readOnly: true
        description:
          description: Description of the component
          examples:
            - Main API gateway component
          maxLength: 500
          type: string
        id:
          description: Unique identifier for the component
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        name:
          description: Name of the component
          examples:
            - api-gateway
          maxLength: 100
          minLength: 1
          type: string
        previousComponentId:
          description: Reference to the previous version of this component
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        slug:
          description: Optional URL-friendly identifier, unique per organization. Auto-generated if not provided.
          examples:
            - api-gateway-v1-2-3
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        version:
          description: Version of the component
          examples:
            - v1.2.3
          maxLength: 100
          minLength: 1
          type: string
      required:
        - id
        - name
        - version
        - createdBy
        - createdAt
      type: object
    ConfigEntitlementValue:
      additionalProperties: false
      properties:
        type:
          description: Value type discriminator
          enum:
            - object
          examples:
            - object
          type: string
        value:
          additionalProperties: {}
          description: Object configuration value
          type: object
      required:
        - type
        - value
      type: object
    Connector:
      additionalProperties: false
      properties:
        created_at:
          description: Timestamp when connector was first registered
          format: date-time
          type: string
        entitlement_slug:
          description: Slug of the BOOLEAN entitlement a license must grant for an organization to activate this connector. Absent means the connector is ungated.
          examples:
            - connector-attio
          type: string
        name:
          description: Stable connector identifier
          examples:
            - kaiten.integration.crm.attio
          type: string
        settings_schema:
          additionalProperties: {}
          description: JSON schema used to validate connector settings payloads
          type: object
        updated_at:
          description: Timestamp when connector registration was last updated
          format: date-time
          type: string
        version:
          description: Registered connector version
          examples:
            - 1.0.0
          type: string
      required:
        - name
        - version
        - settings_schema
        - created_at
        - updated_at
      type: object
    ConnectorActivation:
      additionalProperties: false
      properties:
        activatedAt:
          description: When this organization first activated the connector
          format: date-time
          type: string
        connectorName:
          description: Stable connector identifier
          examples:
            - kaiten.integration.crm.attio
          type: string
      required:
        - connectorName
        - activatedAt
      type: object
    ConnectorSettings:
      additionalProperties: false
      properties:
        connector_name:
          description: Stable connector identifier
          examples:
            - kaiten.integration.crm.attio
          readOnly: true
          type: string
        settings:
          additionalProperties: {}
          description: Connector settings payload
          type: object
      required:
        - connector_name
        - settings
      type: object
    ConnectorSettingsSchema:
      additionalProperties: false
      properties:
        connector_name:
          description: Stable connector identifier
          examples:
            - kaiten.integration.crm.attio
          type: string
        schema:
          additionalProperties: {}
          description: JSON schema describing supported connector settings payload
          type: object
        version:
          description: Registered connector version
          examples:
            - 1.0.0
          type: string
      required:
        - connector_name
        - version
        - schema
      type: object
    ConnectorState:
      additionalProperties: false
      properties:
        activated:
          description: Whether this organization has turned the connector on
          type: boolean
        activatedAt:
          description: When this organization activated the connector. Absent when it has not.
          format: date-time
          type: string
        available:
          description: Whether this deployment has the connector registered
          type: boolean
        connectorName:
          description: Stable connector identifier
          examples:
            - kaiten.integration.crm.attio
          type: string
        entitled:
          description: Whether this organization's licence includes the connector. True for an ungated connector.
          type: boolean
        version:
          description: Registered connector version. Absent when the connector is not available.
          examples:
            - 1.0.0
          type: string
      required:
        - connectorName
        - available
        - entitled
        - activated
      type: object
    Customer:
      additionalProperties: false
      properties:
        createdAt:
          description: Timestamp when the customer was created
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        createdBy:
          $ref: "#/components/schemas/User"
          description: User who created this customer
          readOnly: true
        domain:
          description: Optional customer domain name
          examples:
            - example.tld
          pattern: ^[a-z0-9_-]+(\.[a-z0-9_-]+)+$
          type: string
        externalCustomerId:
          description: Optional identifier for the customer in an external system
          examples:
            - external-customer-id-12345
          type:
            - string
            - "null"
        id:
          description: Unique identifier for the customer
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        integrations:
          additionalProperties:
            $ref: "#/components/schemas/CustomerIntegration"
          description: Integrations grouped by adapter name
          type: object
        name:
          description: Name of the customer
          examples:
            - Awesome Customer
          minLength: 1
          type: string
        slug:
          description: Optional URL-friendly identifier, unique per organization. Auto-generated if not provided.
          examples:
            - awesome-customer
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        updatedAt:
          description: Timestamp when the customer was last updated
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        updatedBy:
          $ref: "#/components/schemas/User"
          description: User who last updated this customer
          readOnly: true
      required:
        - id
        - name
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      type: object
    CustomerBody:
      additionalProperties: false
      properties:
        domain:
          description: Optional customer domain name
          examples:
            - example.tld
          pattern: ^[a-z0-9_-]+(\.[a-z0-9_-]+)+$
          type: string
        error:
          description: Optional integration error message
          type: string
        integrationMetadata:
          additionalProperties: {}
          description: Adapter-specific integration metadata
          type: object
        name:
          description: Customer name
          examples:
            - Awesome Customer
          minLength: 1
          type: string
        slug:
          description: Customer slug
          examples:
            - awesome-customer
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        webUrl:
          description: Absolute http(s) link to the record in the third-party system
          examples:
            - https://app.attio.com/w/acme/record/rec_12345
          type: string
      type: object
    CustomerCreationRejected:
      additionalProperties: false
      properties:
        name:
          type: string
        reason:
          type: string
        slug:
          type: string
      required:
        - name
        - slug
        - reason
      type: object
    CustomerIntegration:
      additionalProperties: false
      properties:
        external_id:
          description: External identifier in the third-party adapter
          examples:
            - rec_12345
          type: string
        last_error:
          description: Last synchronization error message, if any
          type: string
        metadata:
          additionalProperties: {}
          description: Adapter-specific integration metadata
          type: object
        synced_at:
          description: Timestamp of the last synchronization with the adapter
          format: date-time
          readOnly: true
          type: string
        web_url:
          description: Absolute http(s) link to the record in the third-party system
          examples:
            - https://app.attio.com/w/acme/company/rec_12345
          type: string
      required:
        - external_id
        - synced_at
      type: object
    CustomerIntegrationResource:
      additionalProperties: false
      properties:
        domain:
          description: Optional customer domain name
          examples:
            - example.tld
          type: string
        error:
          description: Last synchronization error for this integration, if any
          type: string
        integrationMetadata:
          additionalProperties: {}
          description: Adapter-specific customer integration metadata
          type: object
        name:
          description: Customer name
          examples:
            - Awesome Customer
          type: string
        slug:
          description: Customer slug
          examples:
            - awesome-customer
          type: string
        webUrl:
          description: Absolute http(s) link to the record in the third-party system
          examples:
            - https://app.attio.com/w/acme/company/rec_12345
          type: string
      required:
        - integrationMetadata
        - name
        - slug
      type: object
    DefaultVariant:
      discriminator:
        mapping:
          basic: "#/components/schemas/Basic"
          rollout_date: "#/components/schemas/RolloutDate"
          rollout_percentage: "#/components/schemas/RolloutPercentage"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/Basic"
        - $ref: "#/components/schemas/RolloutDate"
        - $ref: "#/components/schemas/RolloutPercentage"
    Deployment:
      additionalProperties: false
      properties:
        createdAt:
          description: Timestamp when the deployment was recorded
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          type: string
        createdBy:
          $ref: "#/components/schemas/User"
          description: User who recorded this deployment
        deploymentZoneId:
          description: Deployment zone the release was deployed to
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        id:
          description: Unique identifier for this deployment event
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        releaseId:
          description: Release that was deployed
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
      required:
        - id
        - deploymentZoneId
        - releaseId
        - createdBy
        - createdAt
      type: object
    DeploymentZone:
      additionalProperties: false
      properties:
        createdAt:
          description: Timestamp when the deployment zone was created
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        createdBy:
          $ref: "#/components/schemas/User"
          description: User who created this deployment zone
          readOnly: true
        description:
          description: Description of the deployment zone
          examples:
            - "2023-10-01T12:00:00Z"
          type: string
        id:
          description: Unique identifier for the deployment zone
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        metadata:
          additionalProperties: {}
          description: Typed metadata for the deployment zone, validated against the org-scoped MetadataField schema
          examples:
            - region: eu-west-1
          type: object
        name:
          description: Name of the deployment zone
          examples:
            - AWS us-west-2
          minLength: 1
          type: string
        releaseId:
          description: Currently deployed release ID
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        slug:
          description: Optional URL-friendly identifier, unique per organization. Auto-generated if not provided.
          examples:
            - aws-us-west-2
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        type:
          description: "Environment class of the deployment zone. Free-form: any value is stored as sent, but production, staging and development are the ones the console labels, and feature-flag targeting rules match on this field as __kaiten.deploymentZone.type."
          examples:
            - production
          type: string
        updatedAt:
          description: Timestamp when the deployment zone was last updated
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        updatedBy:
          $ref: "#/components/schemas/User"
          description: User who last updated the deployment zone
          readOnly: true
      required:
        - id
        - name
        - type
        - description
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      type: object
    Entitlement:
      additionalProperties: false
      properties:
        aggregationMethod:
          description: Method used to fold each reported usage value into the stored total (NUMBER only). Defaults to SUM.
          enum:
            - COUNT
            - SUM
            - AVERAGE
            - MIN
            - MAX
            - LATEST
          examples:
            - SUM
          type: string
        createdAt:
          description: Timestamp when this entitlement was created
          examples:
            - "2023-10-01T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        description:
          description: Description of the entitlement
          examples:
            - Basic subscription plan with limited features
          type:
            - string
            - "null"
        displayOrder:
          description: Sort order of this entitlement in customer-facing components (ascending). Defaults to 0.
          examples:
            - 10
          format: int32
          minimum: 0
          type: integer
        entitlementGroups:
          description: Groups associated with this entitlement
          items:
            $ref: "#/components/schemas/EntitlementGroupSummary"
          readOnly: true
          type:
            - array
            - "null"
        groupSlugs:
          description: Groups associated with this entitlement, identified by slug
          items:
            type: string
          type:
            - array
            - "null"
          writeOnly: true
        icon:
          description: Optional icon, stored as a provider-namespaced token (provider:name). Decoupled from any specific icon library.
          examples:
            - lucide:rocket
          maxLength: 64
          pattern: ^[a-z0-9]+:[a-z0-9]+(-[a-z0-9]+)*$
          type: string
        id:
          description: Unique identifier for the entitlement
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        name:
          description: Name of the entitlement
          examples:
            - Basic Plan
          minLength: 1
          type: string
        resetAnchor:
          description: "Phase of the periodic usage window: CALENDAR (UTC calendar-aligned) or LICENSE_START (phased off the instance's license start date). Required exactly when resetPeriod is set; defaults to CALENDAR when omitted. Immutable once set."
          enum:
            - CALENDAR
            - LICENSE_START
          examples:
            - CALENDAR
          type: string
        resetPeriod:
          description: Cadence at which usage automatically resets for this NUMBER entitlement. NULL means a lifetime counter (default). Immutable once set -- a full-replace PUT must echo back the stored value.
          enum:
            - HOUR
            - DAY
            - WEEK
            - MONTH
            - YEAR
          examples:
            - MONTH
          type: string
        saleUnitFactor:
          description: Number of base units one sale unit represents (1 sale unit = N base units).
          examples:
            - 3
          exclusiveMinimum: 0
          format: double
          type: number
        saleUnitPlural:
          description: Plural label of the unit this entitlement is sold in, when it differs from the base unit.
          examples:
            - packs
          maxLength: 100
          minLength: 1
          type: string
        saleUnitSingular:
          description: Singular label of the unit this entitlement is sold in, when it differs from the base unit. Requires the base unit labels and the full sale unit trio (saleUnitSingular, saleUnitPlural, saleUnitFactor).
          examples:
            - pack
          maxLength: 100
          minLength: 1
          type: string
        slug:
          description: Optional URL-friendly identifier, unique per organization. Auto-generated if not provided.
          examples:
            - basic-plan
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
        type:
          description: Type of the entitlement
          enum:
            - BOOLEAN
            - NUMBER
            - CONFIG
            - NUMBER_AI_CREDIT
          examples:
            - NUMBER
          type: string
        unitPlural:
          description: Plural label of the base unit this entitlement is measured in (NUMBER type only). Must be provided together with unitSingular.
          examples:
            - seats
          maxLength: 100
          minLength: 1
          type: string
        unitSingular:
          description: Singular label of the base unit this entitlement is measured in (NUMBER type only). Must be provided together with unitPlural.
          examples:
            - seat
          maxLength: 100
          minLength: 1
          type: string
        updatedAt:
          description: Timestamp when this entitlement was last updated
          examples:
            - "2023-10-02T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        userFacing:
          description: Whether this entitlement is displayed in customer-facing components (e.g. plan and pricing pages). Defaults to false.
          examples:
            - true
          type: boolean
        warningThresholdPercent:
          description: Percentage of the cap at which an early-warning event fires before the cap is reached. 0 disables the warning (default).
          examples:
            - 80
          format: int32
          maximum: 100
          minimum: 0
          type: integer
      required:
        - id
        - name
        - description
        - createdAt
        - updatedAt
      type: object
    EntitlementGroup:
      additionalProperties: false
      properties:
        description:
          description: Description of the entitlement group
          examples:
            - All entitlements related to AI usage quotas
          type:
            - string
            - "null"
        id:
          description: Unique identifier for the entitlement group
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        name:
          description: Name of the entitlement group
          examples:
            - AI Quotas
          minLength: 1
          type: string
        slug:
          description: URL-friendly identifier, unique per organization. Auto-generated if not provided.
          examples:
            - ai-quotas
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
      required:
        - id
        - name
        - description
      type: object
    EntitlementGroupSummary:
      additionalProperties: false
      properties:
        id:
          description: Unique identifier for the entitlement group
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        name:
          description: Name of the entitlement group
          examples:
            - AI Quotas
          type: string
        slug:
          description: URL-friendly identifier for the entitlement group
          examples:
            - ai-quotas
          type: string
      required:
        - id
        - name
        - slug
      type: object
    EntitlementGroupUsage:
      additionalProperties: false
      properties:
        currentPeriodEnd:
          description: End of the current usage window (exclusive). Null for a lifetime entitlement.
          format: date-time
          type: string
        currentPeriodStart:
          description: Start of the current usage window (inclusive). Null for a lifetime entitlement.
          format: date-time
          type: string
        entitlementId:
          description: Entitlement ID
          type: string
        entitlementName:
          description: Entitlement name
          type: string
        entitlementSlug:
          description: Entitlement slug
          type: string
        entitlementType:
          description: Entitlement type
          type: string
        licenseValue:
          description: License limit value, discriminated by the 'type' field. Null when the license grants no value.
          discriminator:
            mapping:
              boolean: "#/components/schemas/BooleanEntitlementValue"
              number: "#/components/schemas/NumberEntitlementValue"
              object: "#/components/schemas/ConfigEntitlementValue"
            propertyName: type
          oneOf:
            - $ref: "#/components/schemas/NumberEntitlementValue"
            - $ref: "#/components/schemas/BooleanEntitlementValue"
            - $ref: "#/components/schemas/ConfigEntitlementValue"
        usageValue:
          description: Current usage value, discriminated by the 'type' field. Null when nothing has been reported yet.
          discriminator:
            mapping:
              boolean: "#/components/schemas/BooleanEntitlementValue"
              number: "#/components/schemas/NumberEntitlementValue"
              object: "#/components/schemas/ConfigEntitlementValue"
            propertyName: type
          oneOf:
            - $ref: "#/components/schemas/NumberEntitlementValue"
            - $ref: "#/components/schemas/BooleanEntitlementValue"
            - $ref: "#/components/schemas/ConfigEntitlementValue"
      required:
        - entitlementId
        - entitlementSlug
        - entitlementName
        - entitlementType
      type: object
    EntitlementUsage:
      additionalProperties: false
      properties:
        currentPeriodEnd:
          description: End of the current usage window (exclusive). Null for a lifetime entitlement (no configured reset period).
          examples:
            - "2026-04-01T00:00:00Z"
          format: date-time
          type: string
        currentPeriodStart:
          description: Start of the current usage window (inclusive). Null for a lifetime entitlement (no configured reset period).
          examples:
            - "2026-03-01T00:00:00Z"
          format: date-time
          type: string
        entitlementId:
          description: Unique identifier for the entitlement
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        entitlementSlug:
          description: URL-friendly identifier of the entitlement
          examples:
            - premium-support
          type: string
        licenseId:
          description: Unique identifier for the license to which this entitlement usage belongs
          examples:
            - 123e4567-e89b-12d3-a456-426614174001
          type: string
        licenseSlug:
          description: URL-friendly identifier of the license
          examples:
            - enterprise-license
          type: string
        limit:
          description: License grant this usage is measured against, discriminated by the 'type' field. Null when the license grants no value; -1 means unlimited for a NUMBER entitlement.
          discriminator:
            mapping:
              boolean: "#/components/schemas/BooleanEntitlementValue"
              number: "#/components/schemas/NumberEntitlementValue"
              object: "#/components/schemas/ConfigEntitlementValue"
            propertyName: type
          oneOf:
            - $ref: "#/components/schemas/NumberEntitlementValue"
            - $ref: "#/components/schemas/BooleanEntitlementValue"
            - $ref: "#/components/schemas/ConfigEntitlementValue"
        value:
          description: Resolved entitlement value, discriminated by the 'type' field
          discriminator:
            mapping:
              boolean: "#/components/schemas/BooleanEntitlementValue"
              number: "#/components/schemas/NumberEntitlementValue"
              object: "#/components/schemas/ConfigEntitlementValue"
            propertyName: type
          oneOf:
            - $ref: "#/components/schemas/NumberEntitlementValue"
            - $ref: "#/components/schemas/BooleanEntitlementValue"
            - $ref: "#/components/schemas/ConfigEntitlementValue"
