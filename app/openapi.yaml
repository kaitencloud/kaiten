  /instances/{instanceSlug}/entitlements/{entitlementSlug}/usage/reports:
    get:
      description: "The usage history of one instance and entitlement: every accepted report in the range, with the counter before and after it and the limit in force, in reportSeq order, paged with afterSeq. Decimals are strings. Reports are kept for the organization's usage history retention."
      operationId: listUsageReports
      parameters:
        - description: Instance slug
          in: path
          name: instanceSlug
          required: true
          schema:
            description: Instance slug
            examples:
              - instance-slug
            type: string
        - description: Entitlement slug
          in: path
          name: entitlementSlug
          required: true
          schema:
            description: Entitlement slug
            examples:
              - entitlement-slug
            type: string
        - description: Start of the range, inclusive (RFC 3339). Defaults to 30 days before to, moved up to the start of the organization's usage history when that is later. An explicit from before it answers 422 ListUsageReports.OutsideRetention.
          explode: false
          in: query
          name: from
          schema:
            description: Start of the range, inclusive (RFC 3339). Defaults to 30 days before to, moved up to the start of the organization's usage history when that is later. An explicit from before it answers 422 ListUsageReports.OutsideRetention.
            format: date-time
            type: string
        - description: End of the range, exclusive (RFC 3339). Defaults to now.
          explode: false
          in: query
          name: to
          schema:
            description: End of the range, exclusive (RFC 3339). Defaults to now.
            format: date-time
            type: string
        - description: "Return the reports after this reportSeq: the nextAfterSeq of the previous page"
          explode: false
          in: query
          name: afterSeq
          schema:
            description: "Return the reports after this reportSeq: the nextAfterSeq of the previous page"
            format: int64
            minimum: 0
            type: integer
        - description: Maximum number of reports to return (default 100, max 500)
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of reports to return (default 100, max 500)
            format: int32
            maximum: 500
            minimum: 1
            type: integer
        - description: Only the report sent with this idempotency key
          explode: false
          in: query
          name: transactionId
          schema:
            description: Only the report sent with this idempotency key
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReportPage"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
