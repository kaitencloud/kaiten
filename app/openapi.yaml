  /usage/reports/export:
    get:
      description: Streams every usage report of the organization in the range, across instances and entitlements, as CSV or NDJSON, ordered by reportedAt. Filters narrow it to one instance or one entitlement, including deleted ones by ID. Use it to keep the usage history before deleting the organization.
      operationId: exportOrganizationUsageReports
      parameters:
        - description: Start of the range, inclusive (RFC 3339). Defaults to 30 days before to, moved up to the start of the organization's usage history when that is later. An explicit from before it answers 422 ExportUsageReports.OutsideRetention.
          explode: false
          in: query
          name: from
          schema:
            description: Start of the range, inclusive (RFC 3339). Defaults to 30 days before to, moved up to the start of the organization's usage history when that is later. An explicit from before it answers 422 ExportUsageReports.OutsideRetention.
            format: date-time
            type: string
        - description: End of the range, exclusive (RFC 3339). Defaults to now. At most 31 days after from.
          explode: false
          in: query
          name: to
          schema:
            description: End of the range, exclusive (RFC 3339). Defaults to now. At most 31 days after from.
            format: date-time
            type: string
        - description: "csv (the default): RFC 4180 with a header row. json: NDJSON, one report per line. Anything else answers 422 ExportUsageReports.InvalidFormat."
          explode: false
          in: query
          name: format
          schema:
            description: "csv (the default): RFC 4180 with a header row. json: NDJSON, one report per line. Anything else answers 422 ExportUsageReports.InvalidFormat."
            examples:
              - csv
            type: string
        - description: Only this instance's reports
          explode: false
          in: query
          name: instanceSlug
          schema:
            description: Only this instance's reports
            type: string
        - description: Only this instance's reports. Reaches a deleted instance, whose reports are kept.
          explode: false
          in: query
          name: instanceId
          schema:
            description: Only this instance's reports. Reaches a deleted instance, whose reports are kept.
            format: uuid
            type: string
        - description: Only this entitlement's reports
          explode: false
          in: query
          name: entitlementSlug
          schema:
            description: Only this entitlement's reports
            type: string
        - description: Only this entitlement's reports. Reaches a deleted entitlement, whose reports are kept.
          explode: false
          in: query
          name: entitlementId
          schema:
            description: Only this entitlement's reports. Reaches a deleted entitlement, whose reports are kept.
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                type: string
            text/csv:
              schema:
                type: string
          description: "The reports, as an attachment: CSV with a header row for format=csv, one JSON object per line for format=json"
          headers:
            Content-Disposition:
              description: attachment, with a file name naming the range
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth:
            - read:instances
      summary: Export the organization's usage reports
      tags:
        - instances
