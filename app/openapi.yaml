      operationId: getAuditTrails
      parameters:
        - description: Instance slug
          in: path
          name: instanceSlug
          required: true
          schema:
            description: Instance slug
            examples:
              - instance-slug
            type: string
        - description: Filter by exact event name (e.g. ENTITLEMENT_VALUE_GET)
          explode: false
          in: query
          name: event_name
          schema:
            description: Filter by exact event name (e.g. ENTITLEMENT_VALUE_GET)
            type: string
        - description: RFC3339 timestamp — include entries with timestamp ≥ this value
          explode: false
          in: query
          name: after
          schema:
            description: RFC3339 timestamp — include entries with timestamp ≥ this value
            type: string
        - description: RFC3339 timestamp — include entries with timestamp ≤ this value
          explode: false
          in: query
          name: before
          schema:
            description: RFC3339 timestamp — include entries with timestamp ≤ this value
            type: string
        - description: Maximum number of entries to return (default 50, max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of entries to return (default 50, max 200)
            format: int32
            maximum: 200
            minimum: 1
            type: integer
        - description: Opaque pagination cursor from a previous response's nextCursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque pagination cursor from a previous response's nextCursor
