          description: "The version this read is about. By default the version the family resolves to: its default version if it has one, otherwise its highest-numbered PUBLISHED version. Under ?version=N it is the version asked for instead, whatever its lifecycle state. Absent when the family has no PUBLISHED version, which only a list or an include=versions read returns."
        id:
          description: Unique identifier for the license family
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          type: string
        slug:
          description: URL-friendly identifier of the family, unique per organization and stable across renames and new versions. Deleting the family's last version deletes the family and frees the slug.
          examples:
            - enterprise-license
          type: string
        updatedAt:
          description: Timestamp when a version was last added to this family, or when the family was created. Renames, lifecycle moves and default changes update the versions' own updatedAt, not this one.
          examples:
            - "2023-10-02T12:00:00Z"
          format: date-time
          readOnly: true
          type: string
        versionCount:
          description: Number of versions in this family, whatever their lifecycle state
          examples:
            - 3
          format: int32
          type: integer
        versions:
          description: "Every version of the family, oldest first. Only returned when explicitly requested with include=versions, and then never null: a family always has at least one version."
          items:
            $ref: "#/components/schemas/License"
          type: array
      required:
        - id
        - slug
        - versionCount
        - createdAt
        - updatedAt
      type: object
