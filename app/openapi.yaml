            - array
            - "null"
        slug:
          description: Server-assigned identifier of the minted credential
          examples:
            - system-kaiten-9f2c1a
          type: string
      required:
        - credentialKind
        - platformTokenId
        - issuedTokenId
        - name
        - slug
        - scopes
        - issuedAt
      type: object
    TargetingContext:
      additionalProperties: false
      properties:
        roots:
          description: "Identifiers the server guarantees, and what is reachable below each. Not a closed set: a host may target on its own attributes too"
          items:
            $ref: "#/components/schemas/TargetingContextNode"
          type: array
      required:
        - roots
      type: object
    TargetingContextNode:
      additionalProperties: false
      properties:
        description:
          description: What this value means, shown by the editor
          type: string
        fields:
          description: Named children, for an object
          items:
            $ref: "#/components/schemas/TargetingContextNode"
          type: array
        knownKeys:
          description: Keys this map currently has, for completion. Not a closed set
          items:
            type: string
          type: array
        name:
          description: Name as it is written in a rule
          type: string
        optional:
          description: Whether this value may be absent, in which case has() is worth using
          type: boolean
        type:
          description: Shape of this node's value
          enum:
            - string
            - number
            - boolean
            - object
            - map
            - dyn
          type: string
        values:
          $ref: "#/components/schemas/TargetingContextNode"
          description: Shape shared by every entry, for a map
      required:
        - name
        - type
      type: object
    TargetingRuleDraft:
      additionalProperties: false
      properties:
        rule:
          description: The CEL targeting rule to check. May be blank, which is itself a mistake this reports
          examples:
            - __kaiten.license.familySlug == 'scale'
          maxLength: 10000
          type: string
      required:
        - rule
      type: object
    TargetingRuleIssue:
      additionalProperties: false
      properties:
        column:
          description: 1-based column the problem starts on, or 0 when it has no position
          format: int64
          type: integer
        endColumn:
          description: 1-based column just past the problem, or 0 when only a point is known
          format: int64
          type: integer
        endLine:
          description: 1-based line the problem ends on, or 0 when only a point is known
          format: int64
          type: integer
        line:
          description: 1-based line the problem starts on, or 0 when it has no position
          format: int64
          type: integer
        message:
          description: What is wrong, in the same words the write path refuses it with
          type: string
      required:
        - message
        - line
        - column
      type: object
    TargetingRuleRehearsal:
      additionalProperties: false
      properties:
        evaluationError:
          description: Why the engine could not answer, when it could not — e.g. the rule reads a host attribute this context does not carry. At a real evaluation the rule would simply not match
          type: string
        facts:
          additionalProperties: {}
          description: The __kaiten namespace as enriched for this context — what a rule actually reads. Empty sub-roots mean the context resolved nothing for them
          type: object
        issues:
          description: Problems the lint found. The rule is only run when there are none
          items:
            $ref: "#/components/schemas/TargetingRuleIssue"
          type: array
        matched:
          description: Whether the rule matched this context. Meaningful only when valid and evaluationError is empty
          type: boolean
        valid:
          description: Whether the rule lints clean
          type: boolean
      required:
        - facts
        - issues
        - valid
        - matched
      type: object
    TargetingRuleTrial:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: The evaluation context to rehearse against, as a client would send it. Anything under __kaiten is discarded, exactly as at a real evaluation
          type: object
        rule:
          description: The CEL targeting rule to rehearse
          examples:
            - __kaiten.license.familySlug == 'scale'
          maxLength: 10000
          type: string
        targetingKey:
          description: The key the evaluation would be bucketed on. Resolves license and entitlement facts when it names a customer slug
          type: string
      required:
        - rule
      type: object
    TargetingRuleVerdict:
      additionalProperties: false
      properties:
        issues:
          description: Every problem found, positioned where it is written. Empty when the rule is accepted
          items:
            $ref: "#/components/schemas/TargetingRuleIssue"
          type: array
        valid:
          description: Whether the write path would accept this rule
          type: boolean
      required:
        - issues
        - valid
      type: object
    Targetings:
      description: Polymorphic list of targeting rules (Basic, RolloutDate, RolloutPercentage)
      items:
        anyOf:
          - $ref: "#/components/schemas/BasicTargeting"
          - $ref: "#/components/schemas/RolloutDateTargeting"
          - $ref: "#/components/schemas/RolloutPercentageTargeting"
      type:
        - array
        - "null"
    Token:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          readOnly: true
          type: string
        createdBy:
          $ref: "#/components/schemas/User"
          readOnly: true
        expiresAt:
          format: date-time
          type: string
        id:
          readOnly: true
          type: string
        name:
          type: string
        revokedAt:
          format: date-time
          readOnly: true
          type: string
        revokedBy:
          $ref: "#/components/schemas/User"
          readOnly: true
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
        serviceAccountId:
          readOnly: true
          type: string
        slug:
          description: Optional URL-friendly identifier, unique per service account. Auto-generated if not provided.
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          type: string
      required:
        - name
        - scopes
        - createdAt
        - createdBy
      type: object
    User:
      additionalProperties: false
      properties:
        id:
          description: ID of the user
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        name:
          description: Name of the user
          examples:
            - John Doe
          type: string
      required:
        - id
      type: object
    Variant:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        value: {}
      required:
        - name
        - description
        - value
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "A JWT verified by the proxy in front of this API, or a Kaiten access token (`ksh_...`) — send either as `Authorization: Bearer <token>`. The scopes listed on each operation are the ones the token must carry; `write:<module>` implies `read:<module>`, and `read:*` / `write:*` are wildcards over every module. `x-kaiten-scopes` lists every scope such a token can carry, including those enforced by a service in front of this API rather than by one of its operations."
      scheme: bearer
      type: http
      x-kaiten-scopes:
        - read:components
        - read:customers
        - read:deployment_zones
        - read:entitlements
        - read:feature_flags
        - read:instances
        - read:licenses
        - read:metadata_fields
        - read:notifications
        - read:organizations
        - read:releases
        - read:tokens
        - read:webhooks
        - write:components
        - write:customers
        - write:deployment_zones
        - write:entitlements
        - write:feature_flags
        - write:instances
        - write:licenses
        - write:metadata_fields
        - write:notifications
        - write:organizations
        - write:releases
        - write:tokens
        - write:webhooks
info:
  contact:
    email: support@kaiten.sh
    name: Kaiten Team
  description: A RESTFul API for managing Kaiten features.
  title: Kaiten API
  version: 1.0.0
openapi: 3.1.0
paths:
  /components:
    get:
      description: Returns a cursor-paginated page of components for the current organization.
      operationId: list-components
      parameters:
        - description: Opaque pagination cursor from a previous response's nextCursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque pagination cursor from a previous response's nextCursor
            type: string
        - description: Maximum number of entries to return (default 50, max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of entries to return (default 50, max 200)
            format: int32
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageComponent"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth:
            - read:components
      summary: List components
      tags:
        - components
    post:
      description: Create a new standalone component. Optionally derive it from a previous component version.
      operationId: create-component
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Component"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth:
            - write:components
      summary: Create a new component
      tags:
        - components
  /components/{componentSlug}:
    delete:
      description: Delete a component by slug if it is not linked to any release.
      operationId: delete-component
      parameters:
        - description: Component slug
          in: path
          name: componentSlug
          required: true
          schema:
            description: Component slug
            examples:
              - api-gateway-v1-2-3
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth:
            - write:components
      summary: Delete a component
      tags:
        - components
    get:
      description: Returns a single component by its slug.
      operationId: get-component
      parameters:
        - description: Component slug
          in: path
          name: componentSlug
          required: true
          schema:
            description: Component slug
            examples:
              - api-gateway-v1-2-3
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth:
            - read:components
      summary: Get a component by slug
      tags:
        - components
    put:
      description: Update a component in place when unlinked, or create a new version when it is already linked to releases.
      operationId: update-component
      parameters:
        - description: Component slug
          in: path
          name: componentSlug
          required: true
          schema:
            description: Component slug
            examples:
