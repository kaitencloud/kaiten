{{/*
Same one-policy-per-target rule as SecurityPolicy applies to
BackendTrafficPolicy — rateLimit and requestBuffer are combined into a
single object per route rather than two separate ones.

Numbers mirror docker/traefik/kaiten.yml's rate-limit-public (50rps) and
body-limit (4 MiB) — never previously enforced in the Helm/Traefik path at
all (charts/kaiten's old ingress/traefik/middlewares.yaml rendered no
rate-limit or body-limit Middleware; those controls only existed in local
dev's Traefik config). This chart is the first place they're enforced in a
real deployment.

There is no webhooks counterpart. rate-limit-webhooks (20rps) fronted a
/webhooks route belonging to a service this chart no longer routes to, and it
left with the route rather than being re-homed onto one of the policies below
— so nothing here mirrors that number, deliberately.

Envoy Gateway's local rate limiter is a fixed-window counter
(requests-per-unit), not a token bucket — there's no separate "burst"
concept like Traefik's `average`+`burst`. Using the OLD burst number as
`requests` here (rather than the average) is a deliberate choice: a fixed
1-second window already behaves like "this many requests, then wait for
the window to roll over", which is closer in spirit to bounding a burst
than to throttling a sustained average — but note this permits a higher
sustained rate than Traefik's token bucket did (e.g. 100rps sustained is
possible here, vs Traefik's true ~50rps average). Revisit if that
difference matters in practice.
*/}}
{{- if and .Values.ingress.enabled .Values.ingress.host }}
{{- $api := .Values.api }}
{{- $mw := $api.middlewares }}
# ---- API: public routes — rate-limit-public + body limit ----
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "kaiten.apiFullname" . }}-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.apiLabels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.apiFullname" . }}-public
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 100
            unit: Second
  requestBuffer:
    limit: 4Mi
---
# ---- API: organization credentials (ksh_) — rate-limit-public + body limit ----
#
# Every request on this route costs one bcrypt (cost 10, ~50-100 ms of CPU) in
# the ext_authz call to /api/tokens/validate, whether or not the credential turns
# out to be real. That makes the rate limit here a CPU control and not only an
# abuse control, and it is the only thing standing in front of that work: the
# validation endpoint hashes before it knows anything about the caller.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "kaiten.apiFullname" . }}-pat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.apiLabels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.apiFullname" . }}-pat
  rateLimit:
    type: Local
    local:
      rules:
        # There is no ksm_ selector here any more, and nothing for one to select:
        # the route above matches ksh_ only, so a platform credential never
        # reaches this policy or the bcrypt behind it.
        #
        # The tighter limit it carried has not moved somewhere else, and that is
        # worth being explicit about. Platform credentials are now verified on the
        # internal listener, which no gateway fronts, so the bcrypt they cost is
        # rate-limited by nothing. What replaces the control is reachability: that
        # port is on the api Service and on no HTTPRoute, so an attacker able to
        # spend it is already inside the cluster. A deployment sharing a namespace
        # with untrusted workloads should bound it with a NetworkPolicy.
        #
        # Route-wide ceiling, unchanged: organization credentials (ksh_) are what
        # ordinary SDK traffic carries, and 100/s is the same number the
        # public route uses.
        - limit:
            requests: 100
            unit: Second
  requestBuffer:
    limit: 4Mi
---
# ---- API: JWT-protected routes — body limit only (Traefik's own `api`
# router never carried a rate-limit middleware either — JWT-authenticated
# traffic isn't rate-limited at the proxy layer today) ----
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "kaiten.apiFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.apiLabels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.apiFullname" . }}
  requestBuffer:
    limit: 4Mi
---
{{- end }}
