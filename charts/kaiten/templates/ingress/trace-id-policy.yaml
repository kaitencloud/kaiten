{{/*
Kaiten-TraceId: Envoy assigns/propagates the real OTel trace context
(W3C traceparent) for every request through this Gateway and echoes the
trace ID back to the client — replacing the app-level otelfiber glue that
used to set this header from inside kaiten/api's own Fiber middleware
(otel.WithTraceResponseHeader, removed in the same change as this
policy — see internal/infrastructure/http/server/server.go). If a client
already sent a traceparent, it's echoed as-is. If not, one is synthesized
from Envoy's own x-request-id (generated by the HCM before any HTTP
filter runs; generate_request_id defaults to true, so no extra Gateway
config is required) — a receiver with a valid incoming traceparent
propagates it rather than minting an unrelated one (W3C tracecontext), so
the shared Gateway's OpenTelemetry tracer adopts this as the trace it
exports too, once whoever owns that Gateway resource (outside this
chart, same as the Gateway itself) configures a tracer on it.

Verified live against envoyproxy/envoy v1.31/v1.33 (docker) end to end,
including that dynamicMetadata():set() takes THREE arguments
(filterName, key, value) — passing a table as a single second argument,
the more "obvious" reading of the Lua API, silently no-ops instead of
raising an error, which is exactly why this needed a live test rather
than schema validation alone.

One EnvoyExtensionPolicy with multiple targetRefs, not one per route:
the Lua filter itself never varies by route, and unlike SecurityPolicy/
BackendTrafficPolicy (whose per-route field VALUES differ), there's
nothing here that needs a separate object per target.
*/}}
{{/* Gated: this is a Lua EnvoyExtensionPolicy, and Envoy Gateway disables Lua
by default since the arbitrary-code-execution advisory (GHSA-xrwg-mqj6-6m22).
On a Gateway where Lua is off, the policy is REJECTED and every route it
targets fails closed with a synthetic 500 — so shipping it unconditionally
takes the whole ingress down rather than just losing trace propagation. */}}
{{- if and .Values.ingress.enabled .Values.ingress.host .Values.ingress.traceIdPolicy.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ include "kaiten.fullname" . }}-trace-id
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.apiFullname" . }}-public
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.apiFullname" . }}-pat
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.apiFullname" . }}
    {{- if .Values.app.enabled }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kaiten.appFullname" . }}
    {{- end }}
  lua:
    - type: Inline
      inline: |
        -- Dynamic metadata, not a top-level Lua variable, to pass the
        -- captured traceparent from the request phase to the response
        -- phase safely: top-level variables in an Envoy Lua filter are
        -- shared across concurrent requests on the same worker thread
        -- and would race under load.
        function envoy_on_request(request_handle)
          local tp = request_handle:headers():get("traceparent")
          if not tp then
            -- No incoming trace context: synthesize one from Envoy's own
            -- x-request-id instead of math.random, which isn't
            -- per-request-seeded in Envoy's Lua sandbox and would mint
            -- the SAME "random" id for every request otherwise.
            local rid = request_handle:headers():get("x-request-id")
            if rid then
              local hex = rid:gsub("%-", "")
              if #hex >= 32 then
                tp = "00-" .. hex:sub(1, 32) .. "-" .. hex:sub(1, 16) .. "-01"
                request_handle:headers():add("traceparent", tp)
              end
            end
          end
          if tp then
            request_handle:streamInfo():dynamicMetadata():set("kaiten", "traceparent", tp)
          end
        end

        function envoy_on_response(response_handle)
          local md = response_handle:streamInfo():dynamicMetadata():get("kaiten")
          if md and md.traceparent then
            local trace_id = string.match(md.traceparent, "^%x%x%-(%x+)%-")
            if trace_id then
              response_handle:headers():add("Kaiten-TraceId", trace_id)
            end
          end
        end
{{- end }}
