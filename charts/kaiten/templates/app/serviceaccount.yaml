{{/*
The app's ServiceAccount, rendered on the same condition the Deployment names it
under.

This file did not exist. app/deployment.yaml has always set
`serviceAccountName: <release>-app` inside `{{- if .Values.app.serviceAccount.create }}`,
so `--set app.serviceAccount.create=true` produced a Deployment naming a
ServiceAccount nothing created -- pods that never schedule, with the failure in
an event nobody reads rather than in the render. The default is `create: false`,
which is why it went unnoticed: the broken path was the one nobody took.

Written like api/serviceaccount.yaml, annotations included, because
app.serviceAccount.annotations was a value nothing consumed and the reason to
turn `create` on at all is usually an annotation -- IRSA, Workload Identity.
*/}}
{{- if and .Values.app.enabled .Values.app.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaiten.appFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.appLabels" . | nindent 4 }}
  {{- with .Values.app.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
