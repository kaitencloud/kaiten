{{/*
The api's install-time credentials, rendered from values -- and only from values.

Nothing here when api.secret.existingSecret names a Secret instead, and nothing
here when neither is configured: an empty Secret is worse than no Secret, because
the mount is optional either way but an empty one makes the api fail on a key
that is present-and-blank rather than absent.

Not gated on api.enabled. The bootstrap Job's databaseSecret defaults to this
Secret (see kaiten.platformCredentialDatabaseSecretName), so a release running
that Job with the api turned off still needs it.
*/}}
{{- if include "kaiten.apiSecretFromValues" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaiten.apiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.apiLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.api.secret.databaseConnectionString }}
  KAITEN_DATABASE_CONNECTION_STRING: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.secret.otelAuthorization }}
  OTEL_EXPORTER_OTLP_AUTHORIZATION: {{ . | quote }}
  {{- end }}
{{- end }}
