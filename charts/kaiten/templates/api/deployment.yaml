{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaiten.apiFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.apiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "kaiten.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaiten.apiSelectorLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The config file is mounted, and the process reads it once at startup. A
        # kubelet updates a mounted ConfigMap in place, so without this a
        # `helm upgrade` that changes api.config would change the file under a
        # running pod and change nothing about its behaviour until something
        # unrelated restarted it. The checksum makes the pod template differ, which
        # is what makes the rollout happen.
        checksum/config: {{ include "kaiten.apiConfig" . | sha256sum }}
        {{- if .Values.dapr.enabled }}
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ include "kaiten.apiFullname" . | quote }}
        dapr.io/app-port: {{ .Values.api.service.port | quote }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Kubernetes injects a Docker-link variable per Service in the namespace,
      # named after the Service. This release's api Service is <release>-api, so
      # in the ordinary case where the release is named `kaiten` the kubelet sets
      #
      #   KAITEN_API_PORT=tcp://10.100.157.169:3000
      #
      # which is exactly the variable settings.go binds server.port to. Env beats
      # the config file key by key, so the API is handed a URL where it wants a
      # uint and dies at startup on
      #
      #   'Server.Port' cannot parse value as 'uint': strconv.ParseUint: invalid syntax
      #
      # It was invisible until 26.08.5. This chart used to ship
      # KAITEN_API_PORT: "3000" as a stock api.env default, which shadowed the
      # injected value; moving the port into api.config removed that default and
      # left the collision uncovered, so the deployment broke on upgrade with a
      # config file that reads correctly and an env nobody wrote.
      #
      # Off rather than papered over with a default, because the collision is not
      # specific to this one variable: every Service in the namespace generates
      # six more, and any of them can shadow a setting whose env var happens to
      # match. Nothing here consumes links -- addresses come from values and DNS
      # -- so there is nothing to lose by refusing them.
      enableServiceLinks: false
      serviceAccountName: {{ include "kaiten.apiFullname" . }}
      {{- with (default .Values.global.imagePullSecrets list) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "kaiten.scheduling" .Values.api | nindent 6 }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: wait-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "kaiten.rabbitmqHost" . }} {{ .Values.initContainers.rabbitmqPort }}; do echo "waiting for rabbitmq"; sleep 2; done']
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
            # Second listener, same process: the Platform API. One container, two
            # sockets — see internal/infrastructure/http/server.
            - name: platform
              containerPort: {{ .Values.api.service.platformPort }}
          envFrom:
            # The credentials, and only the credentials. optional: true because a
            # pod that cannot start is worse than a pod that says what is missing:
            # this chart does not create this Secret (see api.secret in values.yaml)
            # and an absent one used to mean CreateContainerConfigError forever,
            # with the kubelet's message and nothing from the API. Now the process
            # starts, reads its config, and refuses with the settings it is short
            # of named one per line.
            - secretRef:
                name: {{ include "kaiten.apiSecretName" . }}
                optional: true
          env:
            # Named explicitly rather than discovered: a file KAITEN_CONFIG_FILE
            # names MUST exist, so a mount that silently did not happen is an error
            # at startup instead of a pod running on defaults and looking healthy.
            - name: KAITEN_CONFIG_FILE
              value: {{ printf "%s/config.yaml" .Values.api.configMountPath | quote }}
            {{- range $key, $value := .Values.api.env }}
            # The override channel. os.Environ is layered over the config file
            # inside the process, so anything here wins over api.config.
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            # The generic seam, spliced last so a rendered manifest reads as
            # "what the chart owns, then what the operator added". Verbatim
            # container env entries, so valueFrom works -- which api.env, being
            # a name/value map, cannot express.
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.api.configMountPath | quote }}
              readOnly: true
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "kaiten.apiFullname" . }}-config
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
