{{- if .Values.bootstrap.platformCredential.enabled }}
{{- $b := .Values.bootstrap.platformCredential }}
{{- $name := include "kaiten.platformCredentialFullname" . }}
{{- $sink := include "kaiten.platformCredentialSink" . }}
# Ordinary resources, not hooks. Helm applies the release's manifests before it
# runs any post-install hook, so these exist by the time the Job below does --
# and being ordinary is what keeps them around afterwards, so an operator
# looking at a failed install can see what the Job was allowed to do.
{{- if $b.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaiten.platformCredentialServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with $b.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kaiten.platformCredentialLabels" . | nindent 4 }}
---
{{- end }}
{{- if eq $sink "secret" }}
# Only with sink.type=secret. With sink.type=file the Job writes to a volume and
# touches no API object, so it gets no permission to create one -- the sink is
# not a flag on a pod that could always create a Secret, it decides whether that
# pod is ever able to.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.platformCredentialLabels" . | nindent 4 }}
rules:
  # `create` cannot be narrowed by resourceNames: the object does not exist yet,
  # so the authorizer has no name to match it against. Namespace-wide create on
  # secrets is the narrowest thing RBAC can express here, and it is why this is a
  # Role rather than a ClusterRole and why the identity holding it belongs to one
  # hook Job rather than to a long-lived workload.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get and delete DO take resourceNames, so the destructive half is bounded to
  # the one Secret this Job owns. Nothing here can read any other Secret in the
  # namespace -- including the database connection string the Job itself is
  # mounted with, which it receives as an env var and never fetches.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $b.secret.name | quote }}]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaiten.platformCredentialLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kaiten.platformCredentialServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
