{{- if .Values.bootstrap.platformCredential.enabled }}
{{- $b := .Values.bootstrap.platformCredential }}
{{- $sink := include "kaiten.platformCredentialSink" . }}
{{- $mintPath := include "kaiten.platformCredentialMintPath" . }}
# Mints this deployment's platform credential (ksm_) once, at install, and puts
# it where bootstrap.platformCredential.sink says.
#
# Two sinks, and the difference is one pod shape rather than one flag:
#
#   secret  mint into an in-memory emptyDir, then publish a Kubernetes Secret.
#           Three containers, kubectl, and a Role that can create one Secret.
#   file    mint straight onto a volume the operator supplied, and stop. One
#           container, no kubectl, no RBAC, nothing in the API server. For a
#           cluster where a credential may not become an API object, and for
#           running this by hand outside Kubernetes.
#
# Neither knows anything about replicating the value elsewhere. A deployment that
# needs it in a secret store reads the Secret this wrote, from its own release.
#
# post-install and NOT pre-upgrade, which is the load-bearing part of this file.
# `platform-token create` is deliberately not idempotent -- the plaintext exists
# for the length of one command and only its bcrypt hash is stored, so a command
# that returned success without a usable credential would be worse than one that
# failed. A hook that re-ran on every `helm upgrade` would therefore either fail
# the upgrade on the name already being active, or, with replace=true, revoke the
# credential its consumers are holding along with every token that credential
# issued. Rotation is an operator decision taken deliberately, never a side
# effect of an unrelated upgrade.
#
# It is also why post-install is safe at all: an ordinary `helm upgrade` does not
# run it, so the mint happens exactly once per install and the value in the
# Secret is always the one this Job just produced.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kaiten.platformCredentialFullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
    kaiten.cloud/bootstrap: "true"
  labels:
    {{- include "kaiten.platformCredentialLabels" . | nindent 4 }}
spec:
  # 0, not 2. A retry after a partial run is a second mint attempt, and if the
  # first attempt reached the database the second fails on the name being active
  # anyway -- so a retry can only turn one honest failure into two confusing
  # ones. The recovery is an operator re-running with replace=true, having
  # decided that the cascade is acceptable.
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "kaiten.platformCredentialLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "kaiten.platformCredentialServiceAccountName" . }}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Pinned rather than inherited from the image: this pod runs two images
        # from two registries and they need not agree on a default UID. 65532 is
        # what the admin-tools image declares (it is FROM scratch, so it has no
        # /etc/passwd and a numeric id is the only thing that works there).
        runAsUser: 65532
        runAsGroup: 65532
        # Without fsGroup the emptyDir below is root-owned and a non-root process
        # cannot write the token into it.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Where the credential is written. One volume either way, so the mint
        # container is the same container in both shapes.
        - name: work
        {{- if eq $sink "secret" }}
          # The only place the plaintext exists outside the target Secret, and it
          # exists in RAM for the lifetime of one pod. Memory rather than the
          # default disk-backed emptyDir so the value never touches a node's
          # filesystem, and sizeLimit because a tmpfs emptyDir is charged against
          # the node's memory.
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- else }}
          # The operator's own volume, verbatim. Durability is theirs to provide:
          # an emptyDir here would mint a credential and destroy it with the pod,
          # and nothing this chart can check would notice.
          {{- toYaml $b.sink.file.volume | nindent 10 }}
        {{- end }}
      {{- if eq $sink "secret" }}
      initContainers:
      {{- else }}
      # One container, and it is the mint: the Job's success then means "the
      # credential is on the volume", which with this sink is the whole job.
      containers:
      {{- end }}
        # Runs against the database, not the API: minting is a database-side
        # operation by nature, and a credential minted
        # here carries no parent platform token, so it sits outside every
        # revocation cascade. That is what keeps it alive across the rotation of
        # whatever credential happened to exist when it was minted.
        - name: mint
          image: "{{ $b.image.repository }}:{{ $b.image.tag }}"
          imagePullPolicy: {{ $b.image.pullPolicy }}
          # `args`, not `command` with a shell: the admin-tools image is FROM
          # scratch, so it has no shell to invoke and its ENTRYPOINT is the
          # binary itself.
          args:
            - platform-token
            - create
            - --name
            - {{ $b.name | quote }}
            - --scopes
            - {{ $b.scopes | quote }}
            {{- if $b.noExpiry }}
            - --no-expiry
            {{- else }}
            - --ttl
            - {{ $b.ttl | quote }}
            {{- end }}
            {{- if $b.replace }}
            - --replace
            {{- end }}
            # --output-file rather than stdout, because a Job's stdout IS its
            # log and the log stack retains it.
            - --output-file
            - {{ $mintPath | quote }}
          env:
            - name: KAITEN_DATABASE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "kaiten.platformCredentialDatabaseSecretName" . }}
                  key: {{ $b.databaseSecret.key | quote }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: {{ dir $mintPath | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- if eq $sink "secret" }}
        # Delete-then-create rather than one upsert, because an upsert needs
        # `create --dry-run=client -o yaml | kubectl apply -f -` and a pipe needs
        # a shell -- which would mean carrying an interpreter into the one pod in
        # this chart that handles a credential in plaintext. Two single-argv
        # kubectl calls do the same job on a distroless image.
        #
        # Deleting first loses nothing: this hook runs on install only, so there
        # is no earlier value in that Secret to preserve, and on a deliberate
        # replace=true re-run the credential it held is being revoked anyway.
        - name: purge
          image: "{{ $b.kubectl.image.repository }}:{{ $b.kubectl.image.tag }}"
          imagePullPolicy: {{ $b.kubectl.image.pullPolicy }}
          args:
            - delete
            - secret
            - {{ $b.secret.name | quote }}
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --ignore-not-found
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        # The regular container is the publishing one on purpose: the Job's
        # success then means "the Secret exists", not "the mint returned".
        - name: publish
          image: "{{ $b.kubectl.image.repository }}:{{ $b.kubectl.image.tag }}"
          imagePullPolicy: {{ $b.kubectl.image.pullPolicy }}
          args:
            - create
            - secret
            - generic
            - {{ $b.secret.name | quote }}
            - --namespace
            - {{ .Release.Namespace | quote }}
            # --from-file, so the value passes as a file and never as an argv
            # entry visible in `kubectl describe pod`. The file carries a
            # trailing newline that admin-tools writes for an operator's benefit;
            # every reader in this codebase goes through pkg/secretfile.Read,
            # which trims it.
            - {{ printf "--from-file=%s=%s" $b.secret.key $mintPath | quote }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: {{ dir $mintPath | quote }}
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
{{- end }}
