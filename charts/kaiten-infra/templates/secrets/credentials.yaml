{{/*
The Secrets this chart creates from values -- and only from values. Nothing
here is rendered when the matching `existingSecret` names one instead; see
the Credentials block in templates/_helpers.tpl for why that is the seam
between this chart and whatever manages secrets around it.
*/}}
{{- if and .Values.migrate.enabled .Values.migrate.database.connectionString (not .Values.migrate.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaiten-infra.migrateSecretName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # The migrate Job is a pre-install/pre-upgrade hook, and an ordinary
    # resource is only applied AFTER every hook has succeeded -- so a Secret
    # the Job reads has to be a hook too, weighted ahead of it. Same shape the
    # ExternalSecret that used to sit here had, and for the same reason.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  KAITEN_DATABASE_CONNECTION_STRING: {{ .Values.migrate.database.connectionString | quote }}
{{- end }}
{{- if and .Values.debeziumServer.enabled (include "kaiten-infra.debeziumCredentialsFromValues" .) (not .Values.debeziumServer.database.existingSecret) }}
{{- $c := .Values.debeziumServer.database.credentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaiten-infra.debeziumSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # The keys are the unprefixed names debezium-server.yaml interpolates through
  # its DB_ environment prefix (${DB_hostname} and friends). Renaming one here
  # renames it there.
  hostname: {{ $c.hostname | quote }}
  dbname: {{ $c.dbname | quote }}
  username: {{ $c.username | quote }}
  password: {{ $c.password | quote }}
  sslmode: {{ $c.sslmode | quote }}
{{- end }}
