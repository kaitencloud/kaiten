apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: rabbitmq-pubsub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: protocol
      value: "amqp"
    - name: hostname
      value: "rabbitmq"
    - name: username
      value: "admin"
    - name: password
      value: "admin"
    - name: durable
      value: true
    - name: deletedWhenUnused
      value: false
    - name: deliveryMode
      value: 2
    - name: prefetchCount
      value: 100
    - name: exchangeKind
      value: "fanout"
    # Hands the app the AMQP headers, as metadata.<key> request headers. One of
    # them is the traceparent of the span that published the message to
    # RabbitMQ -- Debezium's OpenTelemetry agent writes it -- and cdc.consume
    # links that span (cdc.ContextWithPublisher). Off by default.
    - name: publishMessagePropertiesToMetadata
      value: "true"
