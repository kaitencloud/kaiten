apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: config
spec:
  tracing:
    samplingRate: "1"
    otel:
      # host:port, without a scheme, as Dapr documents it:
      # https://docs.dapr.io/operations/observability/tracing/setup-tracing/
      endpointAddress: "jaeger:4318"
      isSecure: false
      protocol: http
