# Debezium source connector (PostgreSQL)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# PostgreSQL connection
debezium.source.database.hostname=db
debezium.source.database.port=5432
debezium.source.database.user=${KAITEN_DATABASE_USER}
debezium.source.database.password=${KAITEN_DATABASE_PASSWORD}
debezium.source.database.dbname=${KAITEN_DATABASE}
debezium.source.database.server.name=kaiten_db

# Plugin and slot configuration
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_slot
debezium.source.publication.name=debezium_publication
debezium.source.publication.autocreate.mode=filtered

# Table filtering
debezium.source.table.include.list=public.outbox_events
debezium.source.schema.include.list=public

# Tombstone events
debezium.source.tombstones.on.delete=false
# Retention deletes are storage maintenance, not domain events. Preserve the
# default truncate suppression while also dropping delete events. The outbox
# is append-only, so an update is never an event either: skipping it keeps a
# data migration (the traceparent backfill) from re-publishing rows.
debezium.source.skipped.operations=u,d,t

# Heartbeat: without it an idle outbox never confirms an LSN and the slot
# retains WAL without bound. The interval alone is not enough -- see
# debeziumServer.heartbeat in charts/kaiten-infra/values.yaml.
debezium.source.heartbeat.interval.ms=60000
debezium.source.heartbeat.action.query=SELECT pg_logical_emit_message(false, 'debezium_heartbeat', '')
debezium.source.message.prefix.exclude.list=debezium_heartbeat

# Topic naming
debezium.source.topic.prefix=kaiten

# RabbitMQ sink connector - OBLIGATOIRES
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=admin
debezium.sink.rabbitmq.connection.password=admin
debezium.sink.rabbitmq.exchange=kaiten.events
# Published for a heartbeat, the only null-valued record here. Its type must
# equal debezium.HeartbeatType in api/pkg/debezium.
debezium.sink.rabbitmq.null.value={"specversion":"1.0","type":"cloud.kaiten.cdc.heartbeat","source":"/debezium/heartbeat","id":"heartbeat","datacontenttype":"application/json","data":{}}

# Format configuration
debezium.format.key=json
debezium.format.value=cloudevents

# Each outbox row becomes one CloudEvent of its own: id is the event's id, type
# its event_type, and traceparent the attribute of the CloudEvents Distributed
# Tracing extension. The Dapr sidecar starts its delivery span only from that
# attribute (dapr/dapr#9990), and the converter takes it from a record header
# only -- which the Outbox EventRouter is what fills, from the traceparent
# column. The router replaces Debezium's change-event envelope with the row,
# the data column under "payload"; debezium.Parse in api/pkg/debezium reads
# both shapes. HeaderFrom keeps source and op, which the converter then reads
# from headers too. The predicate holds both to the outbox topic: a heartbeat
# has no source to copy. charts/kaiten-infra/templates/debezium-server.yaml
# configures the same chain.
debezium.predicates=outbox
debezium.predicates.outbox.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.outbox.pattern=kaiten\\.public\\.outbox_events
debezium.transforms=metadata,outbox
debezium.transforms.metadata.type=org.apache.kafka.connect.transforms.HeaderFrom$Value
debezium.transforms.metadata.fields=source,op
debezium.transforms.metadata.headers=source,op
debezium.transforms.metadata.operation=copy
debezium.transforms.metadata.predicate=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.predicate=outbox
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=organization_id
debezium.transforms.outbox.table.field.event.payload=data
debezium.transforms.outbox.route.by.field=event_type
debezium.transforms.outbox.route.topic.replacement=kaiten.events
debezium.transforms.outbox.table.fields.additional.placement=event_type:header:type,traceparent:header,id:envelope,organization_id:envelope,event_name:envelope,event_type:envelope,occurred_at:envelope,headers:envelope
debezium.transforms.outbox.table.field.additional.missing=ignore
debezium.format.value.metadata.source=header
debezium.format.value.opentelemetry.tracing.attributes.enable=true
