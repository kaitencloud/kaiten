name: Pre-commit on PR Files CI

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      # Needed by the `api-error-declarations` local hook (`go run`). The tool
      # imports only the standard library, so no private-module access/token is
      # required — `go run` never pulls the api module's external deps.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: api/go.sum

      - name: Install pre-commit
        run: pip install pre-commit

      # Pinned to a full commit SHA, never a tag. This action was compromised in
      # CVE-2025-30066 (March 2025): its version tags were retroactively moved to
      # a commit that dumped CI secrets into the build log. A tag is mutable and
      # would let that recur silently; a SHA cannot be re-pointed. When bumping,
      # resolve the new SHA from the upstream tag and update the comment with it.
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      - name: Run pre-commit on changed files
        if: steps.changed-files.outputs.all_changed_files != ''
        run: |
          pre-commit run --files ${{ steps.changed-files.outputs.all_changed_files }}
        env:
          SKIP: no-commit-to-branch  # Skip branch check since we're in CI

      - name: Comment on PR if pre-commit fails
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Pre-commit checks failed. Please run `pre-commit run --all-files` locally and push the fixes.'
            })
