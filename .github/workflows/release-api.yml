name: Release api

on:
  push:
    branches: [main]
    paths: ['api/**']
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Docker meta
        id: meta
        uses: ./.github/actions/docker-meta
        with:
          image-name: api
          source-paths: api

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./api/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}/api:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.registry }}/api:buildcache,mode=max
