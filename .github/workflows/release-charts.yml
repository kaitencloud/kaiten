name: Release charts

on:
  push:
    branches: [main]
    paths: ['charts/**']
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned, and to the same version charts-ci.yml renders with: the
      # assertions and the artifact should not be produced by two different
      # helms.
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid tag: ${GITHUB_REF_NAME}"
            echo "Expected CalVer: YY.MM.patch (e.g. 26.06.0) or pre-release like 26.06.1-rc.1"
            exit 1
          fi

      - name: Compute chart version
        id: version
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "chart=0.0.0-latest" >> "$GITHUB_OUTPUT"
            echo "app=latest"         >> "$GITHUB_OUTPUT"
          else
            echo "chart=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "app=${GITHUB_REF_NAME}"   >> "$GITHUB_OUTPUT"
          fi

      - name: Package kaiten-infra
        run: |
          helm package charts/kaiten-infra \
            --version "${{ steps.version.outputs.chart }}" \
            --app-version "${{ steps.version.outputs.app }}" \
            --destination ./dist/kaiten-infra/

      - name: Package kaiten
        run: |
          helm package charts/kaiten \
            --version "${{ steps.version.outputs.chart }}" \
            --app-version "${{ steps.version.outputs.app }}" \
            --destination ./dist/kaiten/

      # Credentials arrive through `env`, not through `${{ }}` spliced into the
      # script. Interpolation pastes the value into the shell source before the
      # shell parses it, so a value carrying shell syntax would be executed
      # rather than read; an environment variable is only ever data. Harmless
      # for GITHUB_TOKEN today, but this is the shape that becomes injection the
      # moment either value is attacker-influenced.
      - name: Push to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io \
            -u "$GHCR_USER" \
            --password-stdin <<< "$GHCR_TOKEN"
          helm push dist/kaiten-infra/kaiten-infra-*.tgz oci://ghcr.io/kaitencloud/charts
          helm push dist/kaiten/kaiten-*.tgz             oci://ghcr.io/kaitencloud/charts
