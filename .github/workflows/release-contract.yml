name: Release contract

# Publishes the API contract, app/openapi.yaml, as an OCI artifact:
# ghcr.io/kaitencloud/contract. scripts/contract/release.sh does the work and its
# header says what it publishes; this file sets up the tools and the credentials.
#
#   a stable tag (26.11.4)   contract:<semver>, tagged <calver>. The semver comes
#                            from oasdiff (scripts/contract/next-version.sh). A
#                            release whose contract did not change adds its CalVer
#                            to the existing artifact. Pre-releases publish no
#                            contract: an rc is an experiment, not a version.
#   a push to main           contract:next, what the next release would carry.
#
# Pull one with no credential once the package is public:
#
#   oras pull ghcr.io/kaitencloud/contract:4.1.1
#   oras pull ghcr.io/kaitencloud/contract:26.11.4    # the contract of a release
#
# The release also publishes @kaitencloud/openapi on npm under the same semver,
# for consumers that read npm. npm trusted publishing names this workflow: the
# package's trusted publisher on npmjs.com is GitHub Actions, organization
# `kaitencloud`, repository `kaiten`, workflow `release-contract.yml`, no
# environment. Before that is set, the npm step fails and the GHCR artifact
# stands; re-running the job publishes to npm once it is.
#
# GITHUB_TOKEN is the only credential: `packages: write` for GHCR, and the OIDC
# token npm trades for a short-lived one.

on:
  push:
    branches: [main]
    paths:
      - 'app/openapi.yaml'
      - '.github/contracts/LICENSE'
      - '.github/contracts/NOTICE'
      - '.github/contracts/openapi/**'
      - 'scripts/contract/**'
      - '.github/workflows/release-contract.yml'
    # Stable tags only. `+` is one or more of the character before it, and a
    # pattern matches the whole name, so 26.11.4-rc.1 does not. The job checks
    # again.
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9]+'

permissions:
  contents: read
  packages: write # ghcr.io/kaitencloud/contract
  id-token: write # npm trusted publishing

# One release at a time, across tags: two tags pushed together would read the
# same base and decide the same next semver. release.sh refuses to move a semver,
# so the second would fail rather than overwrite, but queueing avoids the failure.
concurrency:
  group: release-contract-${{ github.ref_type }}
  cancel-in-progress: false

env:
  # In step with go-ci.yml, which explains the choice of version.
  GO_VERSION: "1.27.x"
  ORAS_VERSION: "1.3.6"

jobs:
  publish:
    # A fork has neither the package nor the npm publisher.
    if: github.repository == 'kaitencloud/kaiten'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The whole history, to check that a tag is on main.
          fetch-depth: 0

      - name: The tag is a stable release on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a stable release tag (YY.MM.N)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. A contract is released from main only."
            exit 1
          fi

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Pinned in scripts/contract/oasdiff-version, which every workflow that runs
      # oasdiff reads: it decides what the version is, so an unpinned one, or two
      # pins that disagree, silently change the meaning of the numbers.
      - name: Install oasdiff
        run: go install "github.com/oasdiff/oasdiff@$(cat scripts/contract/oasdiff-version)"

      # The one step that cannot be taken back publishes the committed document.
      # go-ci's drift check runs on pull requests only, and main requires no
      # branch to be up to date, so two green pull requests can still merge into a
      # document that no longer matches the handlers. The release proves it here.
      - name: The committed contract is what the handlers generate
        if: github.ref_type == 'tag'
        working-directory: api
        run: |
          set -euo pipefail
          if ! go run cmd/docs/main.go openapi | cmp -s - ../app/openapi.yaml; then
            echo "::error::app/openapi.yaml at $GITHUB_REF_NAME is not what the handlers generate. Run task generate:oas on main, merge it, and tag again."
            exit 1
          fi

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish to GHCR
        id: contract
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            scripts/contract/release.sh tag "$GITHUB_REF_NAME"
          else
            scripts/contract/release.sh next
          fi

      # The same version and files as the artifact. A version npm already has is
      # checked, not published again: it must hold the same contract.
      - name: Publish @kaitencloud/openapi
        if: github.ref_type == 'tag'
        env:
          SEMVER: ${{ steps.contract.outputs.semver }}
          STAGE: ${{ steps.contract.outputs.stage }}
        run: |
          set -euo pipefail
          # Named for the scope too: a scoped mapping outranks --registry.
          registry=https://registry.npmjs.org/
          npm_() { npm "$@" --registry="$registry" "--@kaitencloud:registry=$registry"; }
          published=$(npm_ view "@kaitencloud/openapi@${SEMVER}" version 2>/dev/null || true)
          if [[ "$published" == "$SEMVER" ]]; then
            work="$(mktemp -d)"
            ( cd "$work" && npm_ pack "@kaitencloud/openapi@${SEMVER}" >/dev/null )
            tar -xzf "$work"/*.tgz -C "$work"
            decision=$(scripts/contract/next-version.sh "$SEMVER" "$work/package" "$STAGE")
            if ! grep -qx 'bump=none' <<<"$decision"; then
              echo "::error::npm already has @kaitencloud/openapi@${SEMVER} with another contract. The two registries disagree on what ${SEMVER} is."
              exit 1
            fi
            echo "@kaitencloud/openapi@${SEMVER} is already on npm, with this contract."
            exit 0
          fi
          SEMVER="$SEMVER" STAGE="$STAGE" node -e 'const fs=require("fs");fs.writeFileSync(`${process.env.STAGE}/package.json`,JSON.stringify({name:"@kaitencloud/openapi",version:process.env.SEMVER,description:"Kaiten API OpenAPI 3.1 contract — generated from the Go API, published for downstream SDKs.",license:"Apache-2.0",repository:{type:"git",url:"git+https://github.com/kaitencloud/kaiten.git",directory:"app"},files:["openapi.yaml","NOTICE"],publishConfig:{registry:"https://registry.npmjs.org/",access:"public"}},null,2)+"\n")'
          cd "$STAGE"
          npm publish --tag latest
          echo "Published @kaitencloud/openapi@${SEMVER} (dist-tag: latest)."

      - name: Summary
        if: always() && steps.contract.outcome == 'success'
        env:
          SEMVER: ${{ steps.contract.outputs.semver }}
          CALVER: ${{ steps.contract.outputs.calver }}
          BUMP: ${{ steps.contract.outputs.bump }}
          BASE: ${{ steps.contract.outputs.base }}
          BASE_SOURCE: ${{ steps.contract.outputs.base_source }}
          DIGEST: ${{ steps.contract.outputs.digest }}
          PUSHED: ${{ steps.contract.outputs.pushed }}
        run: |
          {
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "### Contract ${SEMVER} for ${CALVER}"
            else
              echo "### contract:next, which would release as ${SEMVER}"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Bump | ${BUMP} from ${BASE} (${BASE_SOURCE}) |"
            echo "| New artifact | ${PUSHED} |"
            echo "| Digest | \`${DIGEST}\` |"
          } >>"$GITHUB_STEP_SUMMARY"
