name: Charts CI

# helm's own commands, and one grep.
#
# `helm lint` for the chart's structure, `helm template` for what it actually
# renders. Between them they catch a template that does not compile, a values
# key nothing reads, and a guard that refuses a values file it should accept.
#
# The grep is the one rule with no exceptions: no render, under any values, may
# name an ExternalSecret, PushSecret, SecretStore or Vault object. Secret
# plumbing belongs to whoever runs the deployment, and an operator who cloned
# this repository must never meet a CRD that is not on their cluster.

on:
  pull_request:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**']
    paths:
      - 'charts/**'
      - '.github/workflows/charts-ci.yml'

concurrency:
  group: charts-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  charts:
    name: Lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Pinned to the version release-charts.yml packages with, so what CI
      # renders is what an operator installs.
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      # charts/kaiten renders from stock values. charts/kaiten-infra does not,
      # and that is deliberate: its own guard refuses to render until it has
      # been told where the database credential comes from. Naming a Secret is
      # the shortest of the two ways to answer that.
      #
      # examples/minimal-values.yaml is rendered too, because an example nobody
      # renders is an example that rots -- and it is the one path an operator
      # follows on a first install, so it is the one that must not be stale.
      - name: helm lint
        run: |
          set -eu
          helm lint charts/kaiten
          helm lint charts/kaiten -f charts/kaiten/examples/minimal-values.yaml
          helm lint charts/kaiten-infra \
            --set migrate.database.existingSecret=example-db \
            --set debeziumServer.database.existingSecret=example-db

      - name: helm template
        run: |
          set -eu
          helm template kaiten charts/kaiten > render.yaml
          helm template kaiten charts/kaiten \
            -f charts/kaiten/examples/minimal-values.yaml >> render.yaml
          helm template kaiten-infra charts/kaiten-infra \
            --set migrate.database.existingSecret=example-db \
            --set debeziumServer.database.existingSecret=example-db >> render.yaml

      # apiVersion first, because that catches a CRD group whatever its authors
      # called the kinds inside it. The kind list is the belt to that braces:
      # `kind: Policy` anchored at column 0 is a Vault ACL policy and cannot
      # collide with Envoy Gateway's SecurityPolicy or BackendTrafficPolicy.
      - name: No secret plumbing in the render
        run: |
          set -eu
          if grep -nE '^apiVersion: (external-secrets\.io|generators\.external-secrets\.io|redhatcop\.redhat\.io|secrets\.hashicorp\.com)/|^kind: (ExternalSecret|ClusterExternalSecret|PushSecret|ClusterPushSecret|SecretStore|ClusterSecretStore|Policy|KubernetesAuthEngineRole|SecretEngineMount|VaultSecret|VaultStaticSecret|VaultDynamicSecret|VaultAuth|VaultConnection)$' render.yaml; then
            echo "::error::secret plumbing rendered — External Secrets, PushSecrets, SecretStores and Vault objects belong to whoever runs the deployment, not to these charts"
            exit 1
          fi
