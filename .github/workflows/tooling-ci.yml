name: Local tooling fixtures

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'app/scripts/test-stack.mjs'
      - 'app/scripts/stack-process.mjs'
      - 'app/scripts/stack-process.test.mjs'
      - '.github/workflows/app-e2e.yml'
      - '.github/workflows/app-stack.yml'
      - 'Taskfile.yml'
      - 'compose.yml'
      - '.github/workflows/tooling-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Standalone offline fixtures (no Docker or dependency installation)
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Offline owned-process and nightly dedup fixtures
        run: |
          node --test app/scripts/stack-process.test.mjs scripts/tests/nightly-finding.test.cjs
          node --check app/scripts/test-stack.mjs
