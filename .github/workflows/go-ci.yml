name: Go CI

on:
  pull_request:
    branches: [ "main", "feat/**", "fix/**", "chore/**" ]
    paths:
      - 'api/**'
      # The console's GraphQL documents: the API holds a copy of each and pins
      # what it costs, and a test fails when the two part ways.
      - 'app/src/**/*.queries.ts'
      # This workflow itself: a change to how the API is built, linted or tested
      # (the Go version, the linter's) has to be proved by a run of it.
      - '.github/workflows/go-ci.yml'

concurrency:
  group: go-ci-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The one place each Go version of this workflow is set. GO_VERSION builds,
# tests and scans; LINT_GO_VERSION is the exception for golangci-lint only.
# Both are explained above the first Set up Go step.
env:
  GO_VERSION: "1.27.x"
  LINT_GO_VERSION: "1.27.1"

jobs:
  # A migration below main's newest breaks `migrate up` on databases that
  # already applied it: goose refuses a pending version lower than an applied one.
  migration-order:
    name: Migration order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: New migrations are newer than the base branch's
        run: scripts/check-migration-order.sh "origin/${{ github.base_ref }}"

  lint:
    name: Lint & Build /api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # 1.27.x, not `stable`. Two reasons, and they compound:
      #
      #  - `stable` moves on Go's release schedule and the linter is pinned on
      #    the other axis (golangci-lint v2.13.1 below), so a Go release breaks
      #    this build on a PR that changed nothing -- the same drift pinning the
      #    linter was meant to remove. It has happened once already: `stable`
      #    reaching 1.27 handed golangci-lint v2.12.2 a standard library its
      #    bundled go/types could not typecheck.
      #  - go-version-file names ONE go.mod and this repository has two
      #    (api/go.mod, api/cmd/schema-docs/go.mod). They agree on 1.27.0 today,
      #    and the version CI runs should not silently become whichever one
      #    somebody bumps first. 1.27.x satisfies both, newest patch.
      #
      # Same convention as the other Go repositories of the organization.
      #
      # 1.27.x resolves to 1.27.2 today, a security release: 1.27.1 carries
      # GO-2026-6617 (HTTP/2 server crash) and GO-2026-6613 (HTTP/1 desync
      # after a 2xx CONNECT), which govulncheck reports. Build, tests,
      # codegen and govulncheck therefore run on the newest patch.
      #
      # golangci-lint is the one exception: it runs on LINT_GO_VERSION (1.27.1)
      # in the steps around it. Go 1.27.2 writes export data version 5 and
      # golangci-lint v2.13.1, as well as v2.14.0, bundles golang.org/x/tools
      # 0.50.0, which fails on it with "cannot decode "bufio", export data
      # version 5 is greater than maximum supported version 4". Remove those
      # steps, and LINT_GO_VERSION, once a golangci-lint release bundles
      # golang.org/x/tools v0.51.0 or newer, bumping golangci-lint with the
      # rest as described below. x/tools v0.51.0 reads version 5, which is why
      # api/go.mod is already on it.
      #
      # Go, golangci-lint and golang.org/x/tools move together, never one
      # alone. A bump of any of them changes, in the same commit:
      #  - GO_VERSION (and LINT_GO_VERSION while it exists) in this file and
      #    GO_VERSION in pre-commit-ci.yml and release-openapi.yml;
      #  - GOLANGCI_LINT_VERSION in Taskfile.yml (v2.13.1 today);
      #  - the golangci-lint `rev` in .pre-commit-config.yaml;
      #  - the `version:` of golangci-lint-action in this file;
      #  - golang.org/x/tools in api/go.mod (v0.51.0 today). It matters as
      #    much as the linter: Codegen (gqlgen) and the integration tests load
      #    packages through x/tools too.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Build
        run: go build -v ./...

      # Whole-tree, every operation — the pre-commit hook runs the same command,
      # this is the copy a --no-verify commit cannot skip.
      - name: API endpoints declare all returnable error statuses
        run: go run ./cmd/checkapierrors

      # golangci-lint on LINT_GO_VERSION, not GO_VERSION: its bundled x/tools
      # cannot read the export data of Go 1.27.2. See the first Set up Go step
      # for why and for when to drop this step and the one after the linter.
      - name: Set up Go for golangci-lint
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.LINT_GO_VERSION }}
          cache: false

      # Pinned, not `latest`: an unpinned action turns an upstream release into
      # a red build on an unrelated PR. Must match Taskfile.yml's
      # GOLANGCI_LINT_VERSION and .pre-commit-config.yaml's rev.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          args: --timeout=10m ./...
          working-directory: api

      - name: golangci-lint (schema-docs module)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m ./...
          working-directory: api/cmd/schema-docs

      # Back to GO_VERSION for everything that is not the linter: the tidy
      # check, govulncheck and the rest must see the standard library that
      # ships.
      - name: Set up Go again after golangci-lint
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # `go ... ./...` stops at a nested module, so both are named explicitly.
      - name: go.mod and go.sum are tidy
        run: |
          set -eu
          for module in . cmd/schema-docs; do
            (cd "$module" && go mod tidy)
          done
          if ! git diff --exit-code -- go.mod go.sum cmd/schema-docs/go.mod cmd/schema-docs/go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in api/ and api/cmd/schema-docs/, then commit."
            exit 1
          fi

      - name: govulncheck
        run: |
          set -eu
          for module in . cmd/schema-docs; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          done

      # kaiten is depended on; it never depends back. An import in the other
      # direction would be a cycle between two independently released services,
      # and it would arrive as an ordinary-looking `go get` rather than as a
      # decision anyone reviewed.
      #
      # The module GRAPH rather than the import list, so a `replace` left behind
      # after a local experiment fails the same way a real import does. `set -e`
      # is what makes an unresolvable graph a failure instead of a clean pass.
      # What is allowed under github.com/kaitencloud/: this repository's own
      # modules and the public Go SDK.
      - name: Dependency direction
        run: |
          set -eu
          for module in . cmd/schema-docs; do
            graph=$(cd "$module" && go list -m all)
            if printf '%s\n' "$graph" | grep -E '^github\.com/kaitencloud/' | grep -v -E '^github\.com/kaitencloud/(kaiten/|sdk-go( |$))'; then
              echo "::error::$module depends on a Kaiten module other than the Go SDK — kaiten is depended on, it never depends back"
              exit 1
            fi
          done

  codegen:
    name: Codegen up to date /api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # 1.27.x, not `stable`. Two reasons, and they compound:
      #
      #  - `stable` moves on Go's release schedule and the linter is pinned on
      #    the other axis (golangci-lint v2.13.1 below), so a Go release breaks
      #    this build on a PR that changed nothing -- the same drift pinning the
      #    linter was meant to remove. It has happened once already: `stable`
      #    reaching 1.27 handed golangci-lint v2.12.2 a standard library its
      #    bundled go/types could not typecheck.
      #  - go-version-file names ONE go.mod and this repository has two
      #    (api/go.mod, api/cmd/schema-docs/go.mod). They agree on 1.27.0 today,
      #    and the version CI runs should not silently become whichever one
      #    somebody bumps first. 1.27.x satisfies both, newest patch.
      #
      # Same convention as the other Go repositories of the organization.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      # Same loop as `task generate:sqlc`; `go tool sqlc` is version-pinned by
      # go.mod, so the output here is the output every developer gets.
      - name: Regenerate sqlc query helpers
        run: |
          set -eu
          find internal -name sqlc.yaml | sort | while read -r config; do
            go tool sqlc generate -f "$config"
          done

      # Same command as `task generate:gqlgen`. The only //go:generate directive
      # in the module is the gqlgen one in the resolver package, and `go tool
      # gqlgen` is version-pinned by go.mod, so this reproduces the committed
      # execution layer exactly.
      - name: Regenerate GraphQL execution layer
        run: go generate ./...

      - name: Fail if the generated tree is stale
        run: |
          git add --intent-to-add --all
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date — run 'task generate:sqlc' and 'task generate:gqlgen', then commit the result."
            exit 1
          fi

  test:
    name: ${{ matrix.mode.label }} (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            packages: "./cmd/... ./config/... ./internal/... ./pkg/..."
          - name: integration
            packages: "./tests/..."
        mode:
          - label: Test
            flag: -v
          - label: Race test
            flag: -race

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # 1.27.x, not `stable`. Two reasons, and they compound:
      #
      #  - `stable` moves on Go's release schedule and the linter is pinned on
      #    the other axis (golangci-lint v2.13.1 below), so a Go release breaks
      #    this build on a PR that changed nothing -- the same drift pinning the
      #    linter was meant to remove. It has happened once already: `stable`
      #    reaching 1.27 handed golangci-lint v2.12.2 a standard library its
      #    bundled go/types could not typecheck.
      #  - go-version-file names ONE go.mod and this repository has two
      #    (api/go.mod, api/cmd/schema-docs/go.mod). They agree on 1.27.0 today,
      #    and the version CI runs should not silently become whichever one
      #    somebody bumps first. 1.27.x satisfies both, newest patch.
      #
      # Same convention as the other Go repositories of the organization.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      # -shuffle=on is the guard against a test that only passes because an
      # earlier one in the same package left state behind. `task test:api`
      # runs the same flag.
      - name: ${{ matrix.mode.label }}
        run: go test -shuffle=on ${{ matrix.mode.flag }} ${{ matrix.shard.packages }}
