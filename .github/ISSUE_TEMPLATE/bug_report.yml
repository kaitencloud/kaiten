name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the existing issues first, and remove
        tokens, keys and other secrets from anything you paste below.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - API (api/)
        - Console (app/)
        - Helm charts (charts/)
        - Docker Compose stack (compose.yml, docker/)
        - Theme package (packages/theme)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (for example `26.08.3`) or the commit you run.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run Kaiten (local stack with `task dev`, Helm chart, other), your operating system, and the browser for a console problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant output only. Secrets removed.
      render: shell
