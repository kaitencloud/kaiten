name: Setup app E2E
description: >
  Common setup for Playwright E2E jobs in `app/`: Vite+ toolchain, dependency
  install, codegen, and Chromium with cached browsers. Use as the single source
  of truth so the Storybook and App e2e jobs can't drift apart.

inputs:
  install-browsers:
    description: >
      Space-separated list of Playwright browsers to install. Defaults to
      `chromium`. Pass `chromium firefox webkit` if a job needs all browsers.
    required: false
    default: chromium

outputs:
  playwright-version:
    description: Resolved Playwright version (e.g. `1.59.1`).
    value: ${{ steps.playwright-version.outputs.version }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '24'
        cache: pnpm

    - name: Setup Vite+ Toolchain
      uses: voidzero-dev/setup-vp@v1.21.1
      with:
        node-version: '24'
        working-directory: app
        cache: true
        run-install: false

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: vp install

    - name: Generate API SDK & GraphQL Client
      shell: bash
      working-directory: app
      run: vp run generate

    - name: Determine Playwright version
      id: playwright-version
      shell: bash
      working-directory: app
      run: echo "version=$(./node_modules/.bin/playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ inputs.install-browsers }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright browsers (cache miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      run: ./node_modules/.bin/playwright install --with-deps ${{ inputs.install-browsers }}

    - name: Ensure requested browsers and OS dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: app
      run: ./node_modules/.bin/playwright install --with-deps ${{ inputs.install-browsers }}
