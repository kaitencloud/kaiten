version: '2'
sql:
  - engine: "postgresql"
    schema: "../../database/migrations"
    queries: "./queries"
    gen:
      go:
        package: "db"
        out: "."
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
