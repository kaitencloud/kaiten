version: '2'
sql:
  - engine: "postgresql"
    schema: "../../../../infrastructure/database/migrations"
    queries: "./queries"
    gen:
      go:
        package: "db"
        out: "."
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          # token.organization_id is nullable ONLY for kind='platform' rows, and
          # no query on a path that can return one selects it -- the platform
          # lookup omits the column and idx_token_platform_lookup_hash_active
          # deliberately leaves it out of INCLUDE. Pinning the Go type keeps
          # every organization-scoped query's OrganizationID a plain uuid.UUID
          # instead of retyping ~24 generated fields to *uuid.UUID and rippling
          # through every identity repository and mapper.
          - column: "token.organization_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # CreateToken RETURNINGs through a CTE, so sqlc attributes the column
          # to the CTE rather than to "token" and the override above misses it.
          # That query only ever inserts kind='organization', so the value is
          # never NULL on this path either.
          - column: "inserted_token.organization_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
