version: '2'
sql:
  - engine: "postgresql"
    schema: "../../../../infrastructure/database/migrations"
    queries: "./queries"
    gen:
      go:
        package: "db"
        out: "."
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # The view casts this column to SMALLINT so sqlc can type it, and sqlc
          # then takes the cast as NOT NULL; it is NULL unless the entitlement
          # is number-typed.
          - column: "instance_effective_entitlement.limit_cap_exceeded_overage_percent"
            go_type:
              type: "int16"
              pointer: true
